<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 450 200" width="450" height="200" role="img" aria-label="Create your own agent — an empty forge slot waiting to be filled">
  <defs>
    <linearGradient id="cyoBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a1740"/>
      <stop offset="0.55" stop-color="#120d2e"/>
      <stop offset="1" stop-color="#0a0820"/>
    </linearGradient>
    <radialGradient id="cyoGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#8b5cf6" stop-opacity="0.55"/>
      <stop offset="0.5" stop-color="#6366f1" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cyoPlus" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a5b4fc"/>
      <stop offset="1" stop-color="#c4b5fd"/>
    </linearGradient>
    <filter id="cyoSoft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>

  <!-- background -->
  <rect width="450" height="200" fill="url(#cyoBg)"/>

  <!-- center glow -->
  <ellipse cx="225" cy="100" rx="170" ry="120" fill="url(#cyoGlow)">
    <animate attributeName="opacity" values="0.7;1;0.7" dur="4s" repeatCount="indefinite"/>
  </ellipse>

  <!-- dashed slot frame -->
  <rect x="16" y="16" width="418" height="168" rx="18" fill="none"
        stroke="#818cf8" stroke-opacity="0.45" stroke-width="2" stroke-dasharray="10 9"/>

  <!-- emblem ring -->
  <circle cx="225" cy="100" r="44" fill="#1a1740" fill-opacity="0.35"/>
  <circle cx="225" cy="100" r="44" fill="none" stroke="url(#cyoPlus)" stroke-opacity="0.5" stroke-width="2"/>

  <!-- plus glow -->
  <g filter="url(#cyoSoft)" opacity="0.8">
    <rect x="216" y="74" width="18" height="52" rx="9" fill="#8b5cf6"/>
    <rect x="199" y="91" width="52" height="18" rx="9" fill="#8b5cf6"/>
  </g>
  <!-- plus solid -->
  <rect x="218.5" y="76" width="13" height="48" rx="6.5" fill="url(#cyoPlus)"/>
  <rect x="201" y="93.5" width="48" height="13" rx="6.5" fill="url(#cyoPlus)"/>

  <!-- sparkles -->
  <g fill="#c4b5fd">
    <path d="M96 56 l3 8 8 3 -8 3 -3 8 -3 -8 -8 -3 8 -3 z" opacity="0.9">
      <animate attributeName="opacity" values="0.2;1;0.2" dur="3s" repeatCount="indefinite"/>
    </path>
    <path d="M354 132 l2.5 7 7 2.5 -7 2.5 -2.5 7 -2.5 -7 -7 -2.5 7 -2.5 z" opacity="0.7">
      <animate attributeName="opacity" values="1;0.2;1" dur="3.5s" repeatCount="indefinite"/>
    </path>
    <circle cx="120" cy="150" r="2.5" opacity="0.6">
      <animate attributeName="opacity" values="0.2;0.9;0.2" dur="2.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="340" cy="58" r="2" opacity="0.5">
      <animate attributeName="opacity" values="0.9;0.3;0.9" dur="2.8s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
