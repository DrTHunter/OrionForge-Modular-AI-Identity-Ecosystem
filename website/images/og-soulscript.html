<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1200px; height: 630px; overflow: hidden;
    background: #0d0d14;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    color: #fff;
    position: relative;
    display: flex; align-items: center; justify-content: center;
  }

  /* Background grid */
  .grid {
    position: absolute; inset: 0;
    background-image:
      linear-gradient(rgba(147,51,234,0.08) 1px, transparent 1px),
      linear-gradient(90deg, rgba(147,51,234,0.08) 1px, transparent 1px);
    background-size: 60px 60px;
  }

  /* Glow */
  .blob1 {
    position: absolute; top: -200px; left: -150px;
    width: 700px; height: 700px; border-radius: 50%;
    background: radial-gradient(circle, rgba(147,51,234,0.28) 0%, transparent 65%);
    filter: blur(60px);
  }
  .blob2 {
    position: absolute; bottom: -120px; right: -80px;
    width: 500px; height: 500px; border-radius: 50%;
    background: radial-gradient(circle, rgba(219,39,119,0.18) 0%, transparent 65%);
    filter: blur(50px);
  }

  .inner {
    position: relative; z-index: 2;
    text-align: center;
    display: flex; flex-direction: column; align-items: center;
  }

  .eyebrow {
    display: inline-flex; align-items: center; gap: 10px;
    background: rgba(147,51,234,0.12);
    border: 1px solid rgba(147,51,234,0.35);
    border-radius: 999px;
    padding: 8px 20px;
    font-size: 15px; font-weight: 700; letter-spacing: 0.1em;
    color: #c084fc; text-transform: uppercase;
    margin-bottom: 28px;
  }
  .eyebrow-dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: #a855f7; box-shadow: 0 0 8px #a855f7;
  }

  h1 {
    font-size: 88px; font-weight: 900; line-height: 1.0;
    letter-spacing: -0.04em;
    margin-bottom: 24px;
  }
  h1 em { font-style: normal; color: #c084fc; }

  .subtitle {
    font-size: 24px; color: #a1a1aa; font-weight: 400;
    line-height: 1.5; margin-bottom: 36px;
    max-width: 720px;
  }

  .quote {
    border: 1px solid rgba(168,85,247,0.25);
    border-radius: 12px;
    background: rgba(147,51,234,0.08);
    padding: 16px 32px;
    font-size: 17px; color: #71717a; font-style: italic;
    line-height: 1.6; max-width: 600px;
  }
  .quote strong { color: #a1a1aa; font-style: normal; }

  .domain {
    position: absolute; bottom: 28px; right: 40px; z-index: 2;
    font-size: 14px; font-weight: 600; color: #3f3f46;
    letter-spacing: 0.06em;
  }
</style>
</head>
<body>
  <div class="grid"></div>
  <div class="blob1"></div>
  <div class="blob2"></div>

  <div class="inner">
    <div class="eyebrow"><span class="eyebrow-dot"></span> Soul Script Engine</div>
    <h1>The <em>DNA</em> of<br>an AI Identity.</h1>
    <p class="subtitle">Persistent personality · Symbolic memory · Behavioral continuity</p>
    <div class="quote">
      Not just what it does —
      <strong>who it is, what it values, and how it endures.</strong>
    </div>
  </div>

  <div class="domain">soulscript.orionforge.chat</div>
</body>
</html>
