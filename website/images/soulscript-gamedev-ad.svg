<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="SoulScript Engine — Give Your NPCs a Soul. Advertisement for game developers.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#05070f"/>
      <stop offset="1" stop-color="#0b1022"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#818cf8"/>
      <stop offset="0.5" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <radialGradient id="glowIndigo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#6366f1" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowPurple" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#8b5cf6" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowCyan" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <style>
      text { font-family: 'Segoe UI', 'Inter', system-ui, -apple-system, sans-serif; }
      .mono { font-family: 'JetBrains Mono', 'Consolas', ui-monospace, monospace; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <ellipse cx="210" cy="120" rx="420" ry="300" fill="url(#glowIndigo)"/>
  <ellipse cx="990" cy="150" rx="380" ry="280" fill="url(#glowPurple)"/>
  <ellipse cx="640" cy="640" rx="560" ry="280" fill="url(#glowCyan)"/>
  <rect x="16" y="16" width="1168" height="598" rx="26" fill="none" stroke="#ffffff" stroke-opacity="0.08"/>

  <!-- Header / logo lockup -->
  <g>
    <circle cx="86" cy="78" r="23" fill="url(#brand)"/>
    <path d="M86,62 C94,71 97,76 92,84 C90,89 87,91 86,92 C85,91 82,89 80,84 C75,76 78,71 86,62 Z" fill="#04060e" opacity="0.85"/>
    <path d="M86,70 C90,75 91,78 89,82 C88,85 86,86 86,86 C86,86 84,85 83,82 C81,78 82,75 86,70 Z" fill="#fbbf24"/>
    <text x="122" y="72" font-size="25" font-weight="800" fill="#f1f5f9" letter-spacing="3">ORION FORGE</text>
    <text x="123" y="94" font-size="12.5" font-weight="600" fill="#22d3ee" letter-spacing="4">SOULSCRIPT ENGINE</text>
  </g>

  <!-- Eyebrow pill -->
  <g>
    <rect x="64" y="126" width="262" height="34" rx="17" fill="#6366f1" fill-opacity="0.14" stroke="#818cf8" stroke-opacity="0.45"/>
    <text x="195" y="148" font-size="15" font-weight="700" fill="#c4b5fd" letter-spacing="2" text-anchor="middle">FOR GAME DEVELOPERS</text>
  </g>

  <!-- Headline -->
  <text x="62" y="220" font-size="62" font-weight="800" fill="#f1f5f9" letter-spacing="-1">Give Your NPCs</text>
  <text x="62" y="292" font-size="62" font-weight="800" fill="url(#brand)" letter-spacing="-1">a Soul.</text>

  <!-- Subhead -->
  <text x="64" y="338" font-size="22" fill="#f1f5f9" fill-opacity="0.74">Drop-in AI characters with persistent identity,</text>
  <text x="64" y="368" font-size="22" fill="#f1f5f9" fill-opacity="0.74">evolving memory, and natural conversation.</text>

  <!-- Feature list -->
  <g font-size="19" fill="#e2e8f0">
    <g transform="translate(76,408)">
      <circle cx="0" cy="-6" r="12" fill="#34d399" fill-opacity="0.15"/>
      <path d="M-5,-6 L-1.5,-2.5 L5,-10" fill="none" stroke="#34d399" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="26" y="0">Persistent identity &#8212; zero character drift</text>
    </g>
    <g transform="translate(76,448)">
      <circle cx="0" cy="-6" r="12" fill="#34d399" fill-opacity="0.15"/>
      <path d="M-5,-6 L-1.5,-2.5 L5,-10" fill="none" stroke="#34d399" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="26" y="0">Dual-FAISS memory &#8212; 25k+ memories, ms recall</text>
    </g>
    <g transform="translate(76,488)">
      <circle cx="0" cy="-6" r="12" fill="#34d399" fill-opacity="0.15"/>
      <path d="M-5,-6 L-1.5,-2.5 L5,-10" fill="none" stroke="#34d399" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="26" y="0">Hot-swap characters in milliseconds</text>
    </g>
    <g transform="translate(76,528)">
      <circle cx="0" cy="-6" r="12" fill="#34d399" fill-opacity="0.15"/>
      <path d="M-5,-6 L-1.5,-2.5 L5,-10" fill="none" stroke="#34d399" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="26" y="0">Self-hosted &#8226; lean &#8226; TTS / STT ready</text>
    </g>
  </g>

  <!-- Right panel: identity stack -->
  <g>
    <rect x="748" y="150" width="388" height="362" rx="20" fill="#ffffff" fill-opacity="0.03" stroke="#ffffff" stroke-opacity="0.08"/>
    <text x="772" y="188" font-size="13" font-weight="700" fill="#818cf8" letter-spacing="2">INJECTED EVERY TURN</text>

    <g>
      <rect x="772" y="206" width="340" height="40" rx="10" fill="#6366f1" fill-opacity="0.10" stroke="#6366f1" stroke-opacity="0.28"/>
      <circle cx="794" cy="226" r="12" fill="url(#brand)"/>
      <text x="794" y="231" font-size="13" font-weight="800" fill="#04060e" text-anchor="middle">1</text>
      <text x="818" y="231" font-size="15" fill="#cbd5e1">Profile &#183; model &#183; tool perms</text>
    </g>
    <g>
      <rect x="772" y="256" width="340" height="40" rx="10" fill="#8b5cf6" fill-opacity="0.10" stroke="#8b5cf6" stroke-opacity="0.30"/>
      <circle cx="794" cy="276" r="12" fill="url(#brand)"/>
      <text x="794" y="281" font-size="13" font-weight="800" fill="#04060e" text-anchor="middle">2</text>
      <text x="818" y="281" font-size="15" fill="#cbd5e1">Soul Script &#183; read-only FAISS</text>
    </g>
    <g>
      <rect x="772" y="306" width="340" height="40" rx="10" fill="#34d399" fill-opacity="0.10" stroke="#34d399" stroke-opacity="0.28"/>
      <circle cx="794" cy="326" r="12" fill="url(#brand)"/>
      <text x="794" y="331" font-size="13" font-weight="800" fill="#04060e" text-anchor="middle">3</text>
      <text x="818" y="331" font-size="15" fill="#cbd5e1">Memory Vault &#183; dynamic FAISS</text>
    </g>
    <g>
      <rect x="772" y="356" width="340" height="40" rx="10" fill="#22d3ee" fill-opacity="0.10" stroke="#22d3ee" stroke-opacity="0.26"/>
      <circle cx="794" cy="376" r="12" fill="url(#brand)"/>
      <text x="794" y="381" font-size="13" font-weight="800" fill="#04060e" text-anchor="middle">4</text>
      <text x="818" y="381" font-size="15" fill="#cbd5e1">Tool Registry &#183; commands</text>
    </g>

    <text x="942" y="420" font-size="13" fill="#94a3b8" text-anchor="middle" letter-spacing="1">&#9660; fused into one living identity</text>

    <rect x="772" y="434" width="340" height="60" rx="14" fill="#22d3ee" fill-opacity="0.08" stroke="#22d3ee" stroke-opacity="0.25"/>
    <text x="790" y="462" font-size="16" font-weight="700" fill="#a5f3fc">Living, persistent NPC</text>
    <text x="790" y="482" font-size="13" fill="#cbd5e1" fill-opacity="0.8">remembers you &#183; never drifts &#183; talks back</text>
  </g>

  <!-- Footer / CTA -->
  <line x1="64" y1="556" x2="1136" y2="556" stroke="#ffffff" stroke-opacity="0.08"/>
  <text x="64" y="592" class="mono" font-size="18" font-weight="700" fill="#22d3ee">&#60;/&#62;</text>
  <text x="100" y="592" class="mono" font-size="19" font-weight="700" fill="#f1f5f9">github.com/DrTHunter/SoulScript-Engine</text>
  <text x="1136" y="592" font-size="14" fill="#f1f5f9" fill-opacity="0.5" text-anchor="end">Self-host free &#183; PolyForm Noncommercial</text>
</svg>
