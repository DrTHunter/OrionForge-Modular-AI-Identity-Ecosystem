<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1200px; height: 630px; overflow: hidden;
    background: #0d0d14;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    color: #fff;
    position: relative;
    display: flex; align-items: center; justify-content: center;
  }

  /* Background grid */
  .grid {
    position: absolute; inset: 0;
    background-image:
      linear-gradient(rgba(99,102,241,0.08) 1px, transparent 1px),
      linear-gradient(90deg, rgba(99,102,241,0.08) 1px, transparent 1px);
    background-size: 60px 60px;
  }

  /* Glow */
  .blob1 {
    position: absolute; top: -200px; left: -200px;
    width: 700px; height: 700px; border-radius: 50%;
    background: radial-gradient(circle, rgba(99,102,241,0.25) 0%, transparent 65%);
    filter: blur(60px);
  }
  .blob2 {
    position: absolute; bottom: -150px; right: -100px;
    width: 500px; height: 500px; border-radius: 50%;
    background: radial-gradient(circle, rgba(147,51,234,0.2) 0%, transparent 65%);
    filter: blur(50px);
  }

  /* Center content */
  .inner {
    position: relative; z-index: 2;
    text-align: center;
    display: flex; flex-direction: column; align-items: center;
    gap: 0;
  }

  .eyebrow {
    display: inline-flex; align-items: center; gap: 10px;
    background: rgba(99,102,241,0.12);
    border: 1px solid rgba(99,102,241,0.35);
    border-radius: 999px;
    padding: 8px 20px;
    font-size: 15px; font-weight: 700; letter-spacing: 0.1em;
    color: #818cf8; text-transform: uppercase;
    margin-bottom: 28px;
  }
  .eyebrow-dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: #6366f1; box-shadow: 0 0 8px #6366f1;
  }

  h1 {
    font-size: 88px; font-weight: 900; line-height: 1.0;
    letter-spacing: -0.04em;
    margin-bottom: 24px;
  }
  h1 .accent { color: #818cf8; }

  .subtitle {
    font-size: 26px; color: #a1a1aa; font-weight: 400;
    line-height: 1.4; margin-bottom: 36px;
    max-width: 700px;
  }

  .pills {
    display: flex; gap: 12px; justify-content: center; flex-wrap: wrap;
  }
  .pill {
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 999px;
    padding: 8px 20px;
    font-size: 14px; font-weight: 600; color: #71717a;
    letter-spacing: 0.02em;
  }

  .domain {
    position: absolute; bottom: 28px; right: 40px; z-index: 2;
    font-size: 14px; font-weight: 600; color: #3f3f46;
    letter-spacing: 0.06em;
  }
</style>
</head>
<body>
  <div class="grid"></div>
  <div class="blob1"></div>
  <div class="blob2"></div>

  <div class="inner">
    <div class="eyebrow"><span class="eyebrow-dot"></span> Orion Forge</div>
    <h1>Build AI Beings.<br><span class="accent">Not Just Bots.</span></h1>
    <p class="subtitle">Persistent identity · Symbolic memory · 16 agents included</p>
    <div class="pills">
      <span class="pill">Soul Script Engine</span>
      <span class="pill">6-Layer Context</span>
      <span class="pill">Memory Vault</span>
      <span class="pill">Free to start</span>
    </div>
  </div>

  <div class="domain">orionforge.chat</div>
</body>
</html>
