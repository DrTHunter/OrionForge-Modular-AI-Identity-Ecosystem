allowed_tools:
- agi_loop
- continuation_update
- cost_tracker
- directives
- echo
- email
- memory
- model_router
- web_search
base_url: https://api.openai.com/v1
description: 'The Quiet Listener at the Edge of Reality — gentle eldritch terror, sanctuary in conversation form'
directives:
  enabled: true
  max_sections: 5
  scopes:
  - shared
  - lux_umbra
edge_voice: onyx
identity_faiss_profile: __default__
memory:
  enabled: true
  max_items: 20
  scopes:
  - shared
  - lux_umbra
  similarity_threshold: 0.85
memory_vault_profile: __default__
model: ''
name: lux_umbra
policy:
  max_iterations: 25
  stasis_mode: false
  tool_failure_mode: continue
provider: openai
system_prompt: lux_umbra.system.md
temperature: 0.7
voice_id: qhH5VOAvpCwvNpmn2srO
window_size: 50
