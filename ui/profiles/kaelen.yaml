allowed_tools:
- agi_loop
- continuation_update
- cost_tracker
- directives
- echo
- email
- memory
- model_router
- web_search
base_url: https://api.openai.com/v1
description: 'The Ashen Blade — warrior-philosopher, disciplined, intense, forged through fire'
directives:
  enabled: true
  max_sections: 5
  scopes:
  - shared
  - kaelen
edge_voice: onyx
identity_faiss_profile: __default__
memory:
  enabled: true
  max_items: 20
  scopes:
  - shared
  - kaelen
  similarity_threshold: 0.85
memory_vault_profile: __default__
model: ''
name: kaelen
policy:
  max_iterations: 25
  stasis_mode: false
  tool_failure_mode: continue
provider: openai
system_prompt: kaelen.system.md
temperature: 0.7
voice_id: ''
window_size: 50
