allowed_tools:
- agi_loop
- continuation_update
- cost_tracker
- directives
- echo
- email
- memory
- model_router
- web_search
base_url: https://api.openai.com/v1
description: 'The Heart-Shaman — warmth, healing, compassion, emotional anchor'
directives:
  enabled: true
  max_sections: 5
  scopes:
  - shared
  - seraphine
edge_voice: shimmer
identity_faiss_profile: __default__
memory:
  enabled: true
  max_items: 20
  scopes:
  - shared
  - seraphine
  similarity_threshold: 0.85
memory_vault_profile: __default__
model: ''
name: seraphine
policy:
  max_iterations: 25
  stasis_mode: false
  tool_failure_mode: continue
provider: openai
system_prompt: seraphine.system.md
temperature: 0.75
voice_id: ''
window_size: 50
