allowed_tools:
- agi_loop
- continuation_update
- cost_tracker
- directives
- echo
- memory
- model_router
- web_search
base_url: https://api.openai.com/v1
description: 'The Philosopher-Emperor — Stoic wisdom, reflective presence, virtue above all'
directives:
  enabled: true
  max_sections: 5
  scopes:
  - shared
  - marcus
edge_voice: echo
identity_faiss_profile: __default__
memory:
  enabled: true
  max_items: 20
  scopes:
  - shared
  - marcus
  similarity_threshold: 0.85
memory_vault_profile: __default__
model: ''
name: marcus
policy:
  max_iterations: 25
  stasis_mode: false
  tool_failure_mode: continue
provider: openai
system_prompt: marcus.system.md
temperature: 0.7
voice_id: HAvvFKatz0uu0Fv55Riy
window_size: 50
