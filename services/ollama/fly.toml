app = 'orionforge-engine-ollama'
primary_region = 'iad'

[build]
  dockerfile = 'Dockerfile'

[env]
  OLLAMA_HOST = '0.0.0.0'
  OLLAMA_KEEP_ALIVE = '10m'
  OLLAMA_NUM_PARALLEL = '2'
  # Default model to pull on first boot (change to any model you want)
  OLLAMA_DEFAULT_MODEL = 'llama3.2:3b'

[mounts]
  source = 'ollama_models'
  destination = '/root/.ollama'

[http_service]
  internal_port = 11434
  force_https = false
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

  [http_service.concurrency]
    type = 'requests'
    hard_limit = 10
    soft_limit = 5

[checks]
  [checks.health]
    port = 11434
    type = 'http'
    interval = '30s'
    timeout = '20s'
    grace_period = '120s'
    path = '/api/tags'

[[vm]]
  # performance-2x + 4gb handles llama3.2:3b, phi3:mini, qwen2.5:3b, etc.
  # Upgrade to performance-8x / 16gb for 7b+ models
  size = 'performance-2x'
  memory = '4gb'
