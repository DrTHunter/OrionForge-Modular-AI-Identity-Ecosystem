# SearXNG settings for OrionForge
# See https://docs.searxng.org/admin/settings/

use_default_settings: true

general:
  instance_name: "OrionForge Search"
  debug: false

search:
  safe_search: 0
  autocomplete: "google"
  default_lang: "en"

server:
  port: 8080
  bind_address: "0.0.0.0"
  secret_key: "orionforge-searxng-internal-key"
  limiter: false          # No rate limiting — internal use only
  public_instance: false  # Not publicly listed

ui:
  static_use_hash: true

engines:
  - name: google
    engine: google
    shortcut: g
    disabled: false
  - name: bing
    engine: bing
    shortcut: b
    disabled: false
  - name: duckduckgo
    engine: duckduckgo
    shortcut: ddg
    disabled: false
  - name: wikipedia
    engine: wikipedia
    shortcut: wp
    disabled: false
  - name: github
    engine: github
    shortcut: gh
    disabled: false
  - name: arxiv
    engine: arxiv
    shortcut: arx
    disabled: false

outgoing:
  request_timeout: 6.0
  max_request_timeout: 15.0
  useragent_suffix: ""
  pool_connections: 100
  pool_maxsize: 20
