# fly.toml app configuration file generated for orionforge-engine on 2026-03-09T11:30:53-05:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'orionforge-engine'
primary_region = 'iad'

[build]
  dockerfile = 'Dockerfile.fly'

[env]
  PORT = '8989'
  PYTHONUNBUFFERED = '1'

[http_service]
  internal_port = 8989
  force_https = true
  auto_stop_machines = 'suspend'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

  [http_service.concurrency]
    type = 'requests'
    hard_limit = 250
    soft_limit = 200

[checks]
  [checks.health]
    port = 8989
    type = 'http'
    interval = '30s'
    timeout = '5s'
    grace_period = '10s'
    path = '/api/auth/config'

[[vm]]
  size = 'shared-cpu-2x'
  memory = '1gb'
