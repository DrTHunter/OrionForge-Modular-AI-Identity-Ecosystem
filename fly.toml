# fly.toml app configuration file generated for orionforge-engine on 2026-03-09T11:30:53-05:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'orionforge-engine'
primary_region = 'iad'

[build]
  dockerfile = 'Dockerfile.fly'

[env]
  PORT = '8989'
  PYTHONUNBUFFERED = '1'
  # Persist MCP personal tokens on the volume so they survive deploys.
  ORION_MCP_TOKENS_FILE = '/persist/mcp_tokens.json'
  # The embedding model is baked into the image — load it from cache only, never
  # phone the HF Hub at runtime (avoids multi-minute stalls when rate-limited).
  HF_HUB_OFFLINE = '1'
  TRANSFORMERS_OFFLINE = '1'
  # Hosts allowed to reach /mcp (MCP SDK DNS-rebinding protection). Without this
  # a real domain gets 421 "Invalid Host header".
  ORION_MCP_ALLOWED_HOSTS = 'soulscript.orionforge.chat,orionforge-engine.fly.dev'

[http_service]
  internal_port = 8989
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

  # Kept to a single machine: MCP tokens, Stripe billing state, the AGI loop
  # journal, and vault/memory data all live as files on the /persist volume,
  # which only one machine can attach to. Splitting requests across multiple
  # machines would fragment that state. Scale vertically (below) instead of
  # horizontally until that state moves to a shared store.
  [http_service.concurrency]
    type = 'requests'
    hard_limit = 400
    soft_limit = 320

[checks]
  [checks.health]
    port = 8989
    type = 'http'
    interval = '30s'
    timeout = '5s'
    grace_period = '120s'
    path = '/api/auth/config'

[mounts]
  source = 'orion_data'
  destination = '/persist'

[[vm]]
  size = 'shared-cpu-4x'
  memory = '8gb'
