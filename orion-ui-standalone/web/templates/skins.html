{% extends "base.html" %}
{% block title %}Skins — SoulScript Engine{% endblock %}
{% block content %}
<style>
/* ── Skins page styles ─────────────────────────────────────────── */
.skins-header { margin-bottom: 2rem; }
.skins-header h1 {
  font-size: 1.75rem; font-weight: 700; color: #e4e4e7;
  display: flex; align-items: center; gap: 0.75rem;
}
.skins-header h1 .icon {
  width: 2.25rem; height: 2.25rem; border-radius: 0.625rem;
  background: rgba(99,102,241,0.15); display: flex;
  align-items: center; justify-content: center; font-size: 1.1rem;
}
.skins-header p { color: #71717a; font-size: 0.875rem; margin-top: 0.35rem; }

/* Grid */
.skins-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
  gap: 1.5rem;
}

/* Card */
.skin-card {
  background: #1a1a24;
  border: 1px solid #2a2a3a;
  border-radius: 0.75rem;
  overflow: hidden;
  transition: border-color 0.2s ease, box-shadow 0.2s ease, transform 0.15s ease;
  cursor: pointer;
  position: relative;
}
.skin-card:hover {
  border-color: rgba(99,102,241,0.35);
  box-shadow: 0 0 24px rgba(99,102,241,0.08);
  transform: translateY(-2px);
}
.skin-card.active {
  border-color: #6366f1;
  box-shadow: 0 0 0 2px rgba(99,102,241,0.25), 0 0 32px rgba(99,102,241,0.12);
}
.skin-card.active::after {
  content: 'ACTIVE';
  position: absolute; top: 0.75rem; right: 0.75rem;
  padding: 0.15rem 0.6rem; border-radius: 9999px;
  font-size: 0.625rem; font-weight: 700; letter-spacing: 0.06em;
  background: #6366f1; color: #fff;
}

/* Preview area */
.skin-preview {
  height: 150px;
  display: flex; align-items: center; justify-content: center;
  position: relative; overflow: hidden;
}

/* Floating badge (FEATURED, NEW, etc) */
.skin-badge {
  position: absolute; top: 0.75rem; left: 0.75rem;
  padding: 0.15rem 0.6rem; border-radius: 9999px;
  font-size: 0.6rem; font-weight: 700; letter-spacing: 0.06em;
  text-transform: uppercase;
}
.skin-badge.featured { background: #f59e0b; color: #000; }
.skin-badge.new      { background: #ef4444; color: #fff; }
.skin-badge.classic  { background: rgba(99,102,241,0.25); color: #818cf8; }

/* Icon in preview */
.skin-icon {
  width: 3.5rem; height: 3.5rem;
  display: flex; align-items: center; justify-content: center;
  border-radius: 0.75rem;
}
.skin-icon svg { width: 2rem; height: 2rem; }

/* Card body */
.skin-body { padding: 1rem 1.25rem 1.25rem; }
.skin-name { font-size: 1rem; font-weight: 700; color: #e4e4e7; margin-bottom: 0.15rem; }
.skin-author { font-size: 0.75rem; color: #71717a; margin-bottom: 0.5rem; }
.skin-author span { color: #818cf8; }
.skin-desc {
  font-size: 0.8125rem; color: #a1a1aa; line-height: 1.5;
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
}

/* Footer */
.skin-footer {
  display: flex; align-items: center; justify-content: space-between;
  padding: 0.75rem 1.25rem;
  border-top: 1px solid #2a2a3a;
}
.skin-price { font-size: 1rem; font-weight: 700; color: #22d3ee; }
.skin-stats { display: flex; gap: 0.75rem; font-size: 0.75rem; color: #52525b; }
.skin-stats span { display: flex; align-items: center; gap: 0.25rem; }
.skin-fav {
  background: none; border: none; color: #52525b; cursor: pointer;
  font-size: 1rem; transition: color 0.15s ease;
}
.skin-fav:hover { color: #ef4444; }

/* Apply button */
.skin-apply-btn {
  display: inline-flex; align-items: center; gap: 0.5rem;
  padding: 0.5rem 1.25rem; border-radius: 0.5rem;
  font-size: 0.8125rem; font-weight: 600;
  background: #6366f1; color: #fff; border: none; cursor: pointer;
  transition: background 0.15s ease, transform 0.1s ease;
}
.skin-apply-btn:hover { background: #818cf8; }
.skin-apply-btn:active { transform: scale(0.97); }
.skin-apply-btn.applied {
  background: rgba(16,185,129,0.15); color: #10b981;
  cursor: default; pointer-events: none;
}

/* Filter bar */
.skin-filters {
  display: flex; align-items: center; gap: 0.5rem;
  margin-bottom: 1.5rem; flex-wrap: wrap;
}

/* Detail modal overlay */
.skin-modal-bg {
  display: none; position: fixed; inset: 0;
  background: rgba(0,0,0,0.7); z-index: 200;
  align-items: center; justify-content: center;
}
.skin-modal-bg.open { display: flex; }
.skin-modal {
  background: #1a1a24; border: 1px solid #2a2a3a; border-radius: 1rem;
  width: min(560px, 92vw); max-height: 85vh; overflow-y: auto;
  box-shadow: 0 0 64px rgba(0,0,0,0.5);
}
.skin-modal-preview {
  height: 200px; display: flex; align-items: center; justify-content: center;
  position: relative; border-radius: 1rem 1rem 0 0; overflow: hidden;
}
.skin-modal-body { padding: 1.5rem; }
.skin-modal-body h2 { font-size: 1.375rem; font-weight: 700; color: #e4e4e7; margin-bottom: 0.25rem; }
.skin-modal-body .author { font-size: 0.8125rem; color: #71717a; margin-bottom: 1rem; }
.skin-modal-body .author span { color: #818cf8; }
.skin-modal-body .desc { font-size: 0.875rem; color: #a1a1aa; line-height: 1.65; margin-bottom: 1.25rem; }
.skin-modal-palette { display: flex; gap: 0.5rem; margin-bottom: 1.5rem; }
.skin-modal-swatch {
  width: 2.5rem; height: 2.5rem; border-radius: 0.5rem;
  border: 2px solid #2a2a3a; position: relative;
}
.skin-modal-swatch .tip {
  display: none; position: absolute; bottom: -1.75rem; left: 50%; transform: translateX(-50%);
  font-size: 0.625rem; color: #a1a1aa; white-space: nowrap; background: #12121a;
  padding: 0.15rem 0.4rem; border-radius: 0.25rem;
}
.skin-modal-swatch:hover .tip { display: block; }
.skin-modal-actions {
  display: flex; gap: 0.75rem; align-items: center; justify-content: flex-end;
  padding-top: 1rem; border-top: 1px solid #2a2a3a;
}
.skin-modal-close {
  background: none; border: 1px solid #2a2a3a; color: #a1a1aa;
  padding: 0.5rem 1.25rem; border-radius: 0.5rem; font-size: 0.8125rem;
  cursor: pointer; transition: all 0.15s ease;
}
.skin-modal-close:hover { border-color: #52525b; color: #e4e4e7; }

/* Toast */
.skin-toast {
  position: fixed; bottom: 2rem; right: 2rem;
  padding: 0.75rem 1.5rem; border-radius: 0.5rem;
  background: rgba(16,185,129,0.15); color: #10b981; border: 1px solid rgba(16,185,129,0.25);
  font-size: 0.8125rem; font-weight: 500; z-index: 9999;
  opacity: 0; transform: translateY(8px); transition: all 0.25s ease;
}
.skin-toast.show { opacity: 1; transform: translateY(0); }

/* Section divider */
.skins-section-title {
  font-size: 0.75rem; font-weight: 600; text-transform: uppercase;
  letter-spacing: 0.06em; color: #52525b; margin: 2.5rem 0 1rem;
  padding-bottom: 0.5rem; border-bottom: 1px solid #1e1e2a;
}
</style>

<!-- ═══ Header ═══ -->
<div class="skins-header">
  <h1>
    <span class="icon">🎨</span> UI Skins
  </h1>
  <p>Choose a visual theme for the SoulScript dashboard. Changes apply instantly.</p>
</div>

<!-- ═══ Filter bar ═══ -->
<div class="skin-filters">
  <button class="filter-btn active" onclick="filterSkins('all')">All</button>
  <button class="filter-btn" onclick="filterSkins('dark')">Dark</button>
  <button class="filter-btn" onclick="filterSkins('light')">Light</button>
  <button class="filter-btn" onclick="filterSkins('neon')">Neon</button>
  <button class="filter-btn" onclick="filterSkins('retro')">Retro</button>
  <button class="filter-btn" onclick="filterSkins('nature')">Nature</button>
</div>

<!-- ═══ Skins Grid ═══ -->
<div class="skins-grid" id="skins-grid"></div>

<!-- ═══ Detail Modal ═══ -->
<div class="skin-modal-bg" id="skin-modal" onclick="if(event.target===this)closeSkinModal()">
  <div class="skin-modal">
    <div class="skin-modal-preview" id="modal-preview"></div>
    <div class="skin-modal-body">
      <h2 id="modal-name"></h2>
      <p class="author" id="modal-author"></p>
      <p class="desc" id="modal-desc"></p>
      <div style="font-size:0.75rem;color:#52525b;text-transform:uppercase;letter-spacing:0.06em;margin-bottom:0.5rem;">

        <button class="skin-apply-btn" id="modal-apply-btn" onclick="applyFromModal()">Apply Skin</button>
      </div>
    </div>
  </div>
</div>

<!-- ═══ Toast ═══ -->
<div class="skin-toast" id="skin-toast"></div>

/* ══════════════════════════════════════════════════════════════════
   STATE
   ══════════════════════════════════════════════════════════════════ */
let activeSkin = "{{ active_skin }}";
let currentFilter = "all";
let modalSkinId = null;

/* ══════════════════════════════════════════════════════════════════
   RENDERING
   ══════════════════════════════════════════════════════════════════ */
function renderGrid() {
  const grid = document.getElementById("skins-grid");
  const filt = currentFilter;
  const filtered = SKINS.filter(s => filt === "all" || s.tags.includes(filt));
  grid.innerHTML = filtered.map(s => {
    const isActive = s.id === activeSkin;
    const statusLabel = isActive ? '✓ Active' : 'Preview →';
    const statusColor = isActive ? '#10b981' : '#52525b';
    return `
    <div class="skin-card ${isActive ? 'active' : ''}"
         data-id="${s.id}" onclick="openSkinModal('${s.id}')">
      <div class="skin-preview" style="background:${s.previewBg}">
        ${s.badge ? `<span class="skin-badge ${s.badge}">${s.badge}</span>` : ''}
        <div class="skin-icon" style="background:${s.iconBg}">${s.icon}</div>
      </div>
      <div class="skin-body">
        <div class="skin-name">${s.name}</div>
        <div class="skin-author">by <span>${s.author}</span></div>
        <div class="skin-desc">${s.desc}</div>
      </div>
      <div class="skin-footer">
        <span class="skin-price" style="color:#10b981">Free</span>
        <div style="display:flex;align-items:center;gap:0.75rem;">
          <span style="font-size:0.75rem;color:${statusColor}">
            ${statusLabel}
          </span>
        </div>
      </div>
    </div>
  `;
  }).join('');
}

/* ── Filters ─────────────────────────────────────────────────── */
function filterSkins(tag) {
  currentFilter = tag;
  document.querySelectorAll('.skin-filters .filter-btn').forEach(b => {
    b.classList.toggle('active', b.textContent.trim().toLowerCase() === tag);
  });
  renderGrid();
}

/* ── Modal ────────────────────────────────────────────────────── */
function openSkinModal(id) {
  const s = SKINS.find(x => x.id === id);
  if (!s) return;
  modalSkinId = id;
  document.getElementById('modal-preview').style.background = s.previewBg;
  document.getElementById('modal-preview').innerHTML = `<div class="skin-icon" style="background:${s.iconBg};width:4rem;height:4rem;border-radius:1rem;">${s.icon.replace('width="2rem"','width="2.5rem"').replace('height="2rem"','height="2.5rem"')}</div>`;
  document.getElementById('modal-name').textContent = s.name;
  document.getElementById('modal-author').innerHTML = `by <span>${s.author}</span>`;
  document.getElementById('modal-desc').textContent = s.desc;

  // Palette swatches
  const pal = document.getElementById('modal-palette');
  pal.innerHTML = Object.entries(s.palette).map(([k,v]) => `
    <div class="skin-modal-swatch" style="background:${v}">
      <span class="tip">${k}: ${v}</span>
    </div>
  `).join('');

  // Apply button state
  const btn = document.getElementById('modal-apply-btn');
  if (s.id === activeSkin) {
    btn.className = 'skin-apply-btn applied';
    btn.textContent = '✓ Active';
    btn.onclick = null;
  } else {
    btn.className = 'skin-apply-btn';
    btn.style.background = '';
    btn.textContent = 'Apply Skin';
    btn.onclick = applyFromModal;
  }

  document.getElementById('skin-modal').classList.add('open');
}

function closeSkinModal() {
  document.getElementById('skin-modal').classList.remove('open');
  modalSkinId = null;
}

/* ── Apply ────────────────────────────────────────────────────── */
async function applySkin(id) {
  const s = SKINS.find(x => x.id === id);
  if (!s) return;

  // Save to backend
  try {
    const resp = await fetch('/api/skin', {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ skin: id })
    });
    if (!resp.ok) throw new Error('Save failed');
  } catch (e) {
    showSkinToast('Failed to save skin preference', true);
    return;
  }

  activeSkin = id;
  injectSkinCSS(s);
  renderGrid();
  showSkinToast(`Skin applied: ${s.name}`);
}

async function applyFromModal() {
  if (!modalSkinId || modalSkinId === activeSkin) return;
  await applySkin(modalSkinId);
  closeSkinModal();
}

/* ── CSS Injection ───────────────────────────────────────────── */
function injectSkinCSS(skin) {
  /* Remove old skins-page-only override if present */
  let el = document.getElementById('skin-override-css');
  if (el) el.textContent = '';

  if (skin.id === 'default' || !skin.css || Object.keys(skin.css).length === 0) {
    /* Reset both override layers */
    let globalEl = document.getElementById('skin-global-css');
    if (globalEl) globalEl.textContent = '';
    document.documentElement.style.cssText = '';
    reloadTailwindPalette(null);
    return;
  }

  /* Use the comprehensive base-loader override (covers all pages) */
  if (window.__orionSkinApply) {
    window.__orionSkinApply(skin.id);
  }

  /* Set CSS custom properties for any explicit overrides */
  const root = document.documentElement;
  for (const [prop, val] of Object.entries(skin.css)) {
    root.style.setProperty(prop, val);
  }

  reloadTailwindPalette(skin.palette);
}

function reloadTailwindPalette(palette) {
  // Update tailwind config dynamically
  if (typeof tailwind !== 'undefined' && tailwind.config) {
    const def = { bg: '#0f0f14', card: '#1a1a24', border: '#2a2a3a', accent: '#6366f1', accent2: '#818cf8', highlight: '#22d3ee', warn: '#f59e0b', danger: '#ef4444', success: '#10b981', muted: '#71717a' };
    const p = palette || def;
    tailwind.config.theme.extend.colors.forge = { ...def, ...p };
  }
}

/* ── Toast ────────────────────────────────────────────────────── */
function showSkinToast(msg, isError) {
  const t = document.getElementById('skin-toast');
  t.textContent = msg;
  t.style.background = isError ? 'rgba(239,68,68,0.15)' : 'rgba(16,185,129,0.15)';
  t.style.color = isError ? '#ef4444' : '#10b981';
  t.style.borderColor = isError ? 'rgba(239,68,68,0.25)' : 'rgba(16,185,129,0.25)';
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}

/* ── Keyboard ────────────────────────────────────────────────── */
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') closeSkinModal();
});

/* ── Init ─────────────────────────────────────────────────────── */
renderGrid();
</script>
