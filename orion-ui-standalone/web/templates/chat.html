  const thread = document.getElementById('chat-thread');
  const empty  = document.getElementById('empty-state');
  if (empty) empty.style.display = 'none';
  const data = m.data ? {...m.data} : {};
  if (!data.agent) {
    const chatAgent = document.getElementById('chat-agent')?.value;
    if (chatAgent) data.agent = chatAgent;
  }
  const t = m.time ? new Date(m.time).toLocaleTimeString() : '';
  _renderEntry(m.role, m.text, data, t, m.layers);
}

function _renderEntry(role, text, data, timeStr, layers) {
  const thread = document.getElementById('chat-thread');
  switch (role) {
    case 'user': {
      const el = document.createElement('div');
      el.className = 'chat-entry user-entry';
      const uName = _userProfile.name || 'You';
      const uColor = _userProfile.color || '#10b981';
      const uInitial = uName.charAt(0).toUpperCase();
      const uAvatarHtml = _userProfile.image
        ? `<div class="msg-avatar"><img src="${_userProfile.image}" alt="${uName}"></div>`
        : `<div class="msg-avatar" style="background:${uColor};">${uInitial}</div>`;
      el.innerHTML = `<div class="msg-header">
        <span class="msg-time">${timeStr}</span>
        <span class="msg-name" style="font-size:1rem;">${esc(uName)}</span>
        ${uAvatarHtml}
      </div>
      <div class="msg-body-wrap"><div class="msg-body">${esc(text)}</div></div>`;
      thread.appendChild(el);
      break;
    }
    case 'assistant': {
      const el = document.createElement('div');
      el.className = 'chat-entry assistant-entry';
      const d = data || {};
      const agentName = d.agent || 'agent';
      const agentLabel = agentName.charAt(0).toUpperCase() + agentName.slice(1);
      const av = _avatarMap[agentName] || {};
      const avatarColor = av.color || _agentAvatarColor(agentName);
      const agentInitial = agentName.charAt(0).toUpperCase();
      const avatarHtml = av.image
        ? `<div class="msg-avatar"><img src="${av.image}" alt="${agentLabel}"></div>`
        : `<div class="msg-avatar" style="background:${avatarColor};">${agentInitial}</div>`;
      let metaHtml = '';
      let apiCostStr = null;
      if (d.usage || d.model) {
        const parts = [];
        if (d.model) parts.push(d.model);
        if (d.usage) {
          if (d.usage.prompt_tokens) parts.push(`In: ${d.usage.prompt_tokens.toLocaleString()}`);
          if (d.usage.completion_tokens) parts.push(`Out: ${d.usage.completion_tokens.toLocaleString()}`);
        }
        const cost = d.cost?.total_cost || _estimateCost(d.model, d.usage);
        if (cost !== null) {
          apiCostStr = typeof cost === 'number' ? cost.toFixed(6) : cost;
          parts.push(`<span class="meta-cost">API $${apiCostStr}</span>`);
        }
        metaHtml = `<div class="msg-meta">${parts.join(' · ')}</div>`;
      }

      // Prompt layers inspector
      let layersHtml = '';
      if (layers) {
        const layerId = 'layers-' + Date.now() + Math.random().toString(36).slice(2,6);
        const toolChars = (layers.tools?.names||[]).reduce((s,n) => s + n.length + 20, 0) * (layers.tools?.count||0 ? 1 : 0);
        const total = (layers.base_prompt?.chars||0) + (layers.soul_script?.chars||0)
                    + (layers.always_on?.chars||0) + (layers.vault?.chars||0) + (layers.conversation?.chars||0) + toolChars;
        const pct = (c) => total > 0 ? Math.max(2, Math.round(c / total * 100)) : 0;
        layersHtml = `
          <button class="layers-toggle" onclick="toggleLayers('${layerId}', this)">◇ Prompt Layers</button>
          <div class="layer-bar" id="bar-${layerId}">
            <div class="layer-bar-seg layer-bar-1" style="width:${pct(layers.base_prompt?.chars||0)}%"></div>
            <div class="layer-bar-seg layer-bar-2" style="width:${pct(layers.soul_script?.chars||0)}%"></div>
            <div class="layer-bar-seg layer-bar-3" style="width:${pct(layers.always_on?.chars||0)}%"></div>
            <div class="layer-bar-seg layer-bar-4" style="width:${pct(layers.vault?.chars||0)}%"></div>
            <div class="layer-bar-seg layer-bar-5" style="width:${pct(layers.conversation?.chars||0)}%"></div>
            <div class="layer-bar-seg layer-bar-6" style="width:${pct(toolChars)}%"></div>
          </div>
          <div class="layers-panel" id="${layerId}">
            ${renderLayerRow(1, 'Base Prompt', layers.base_prompt?.chars + ' chars', layers.base_prompt?.preview)}
            ${renderLayerRow(2, 'Soul Script (Directive FAISS)', layers.soul_script?.chunks + ' chunks · ' + layers.soul_script?.chars + ' chars', layers.soul_script?.preview)}
            ${renderLayerRow(3, 'Always-On Knowledge', layers.always_on?.chunks + ' notes · ' + layers.always_on?.chars + ' chars', layers.always_on?.preview)}
            ${renderLayerRow(4, 'Memory Vault', layers.vault?.memories + ' memories · ' + layers.vault?.chars + ' chars', (layers.vault?.snippets||[]).join('\\n---\\n'))}
            ${renderLayerRow(5, 'Conversation', layers.conversation?.turns + ' turns · ' + layers.conversation?.chars + ' chars', '')}
            ${renderLayerRow(6, 'Tool Registry', layers.tools?.count + ' tools', (layers.tools?.names||[]).join(', '))}
          </div>`;
      }

      // Generated image (if present in data)
      let imageHtml = '';
      if (d.generated_image && d.generated_image.url) {
        const gi = d.generated_image;
        const altText = gi.prompt ? gi.prompt.substring(0, 120) : 'Generated image';
        const provLabel = gi.provider || '';
        imageHtml = `<div class="msg-generated-image" style="margin:0.75rem 0 0.5rem; max-width:512px;">
          <img src="${gi.url}" alt="${esc(altText)}"
               style="width:100%; border-radius:0.5rem; cursor:pointer; border:1px solid rgba(255,255,255,0.08);"
               onclick="window.open(this.src, '_blank')" title="Click to open full size">
          <div style="display:flex; align-items:center; gap:0.375rem; margin-top:0.375rem; font-size:0.7rem; color:#71717a;">
            <span>🎨</span>
            <span>${esc(provLabel)}</span>
            ${gi.revised_prompt ? `<span title="${esc(gi.revised_prompt)}" style="cursor:help; text-decoration:underline dotted;">revised prompt</span>` : ''}
          </div>
        </div>`;
      }

      // Generated video (if present in data)
      let videoHtml = '';
      if (d.generated_video) {
        const gv = d.generated_video;
        if (gv.url) {
          const provLabel = gv.provider || 'google_veo';
          const provDisplay = {'google_veo2':'Veo 2','google_veo3':'Veo 3','google_veo31':'Veo 3.1'}[provLabel] || provLabel;
          videoHtml = `<div class="msg-generated-video" style="margin:0.75rem 0 0.5rem; max-width:640px;">
            <video src="${gv.url}" controls preload="metadata"
                   style="width:100%; border-radius:0.5rem; border:1px solid rgba(255,255,255,0.08); background:#000;">
              Your browser does not support the video tag.
            </video>
            <div style="display:flex; align-items:center; gap:0.375rem; margin-top:0.375rem; font-size:0.7rem; color:#71717a;">
              <span>🎬</span>
              <span>${esc(provDisplay)}</span>
              <a href="${gv.url}" download style="color:#818cf8; text-decoration:none; margin-left:0.5rem;">⬇ Download</a>
            </div>
          </div>`;
        } else if (gv.error) {
          videoHtml = `<div class="msg-generated-video-error" style="margin:0.75rem 0 0.5rem; padding:0.625rem 0.75rem; border:1px solid rgba(244,63,94,0.35); border-radius:0.5rem; background:rgba(244,63,94,0.08); color:#fecdd3; font-size:0.78rem; max-width:640px;">
            🎬 Video generation failed: ${esc(gv.error)}
          </div>`;
        }
      }

      el.innerHTML = `<div class="msg-header">
        ${avatarHtml}
        <span class="msg-name">${agentLabel}</span>
        <span class="msg-time">${timeStr}</span>
      </div>
      <div class="msg-body-wrap"><div class="msg-body">${formatAssistantText(text)}</div></div>${imageHtml}${videoHtml}${metaHtml}${layersHtml}`;
      thread.appendChild(el);

      // Tool calls indicator
      if (d.tool_calls && d.tool_calls.length > 0) {
        const tcId = 'tc-' + Date.now() + Math.random().toString(36).slice(2,6);
        const tcEl = document.createElement('div');
        tcEl.style.cssText = 'margin-left:3.5rem;margin-top:0.25rem;';
        let entriesHtml = d.tool_calls.map(tc =>
          `<div class="tool-call-entry"><span class="tool-call-name">⚡ ${esc(tc.tool)}</span><span class="tool-call-round">round ${tc.round}</span>
          <div class="tool-call-args">${esc(JSON.stringify(tc.arguments))}</div>
          <div class="tool-call-result">${esc(tc.result)}</div></div>`
        ).join('');
        tcEl.innerHTML = `<button class="tool-calls-badge" onclick="let p=document.getElementById('${tcId}');p.classList.toggle('open');this.classList.toggle('open');">⚡ ${d.tool_calls.length} tool call${d.tool_calls.length===1?'':'s'}</button>
          <div class="tool-calls-panel" id="${tcId}">${entriesHtml}</div>`;
        thread.appendChild(tcEl);
      }

      // ── Per-message action bar (Copy, Read Aloud, Continue, Regenerate) ──
      const msgIdx = _msgs.length;   // index of *next* push (will be this msg)
      const actionsBar = document.createElement('div');
      actionsBar.className = 'msg-actions';

      // Copy button
      const copyBtn = document.createElement('button');
      copyBtn.className = 'msg-action-btn';
      copyBtn.innerHTML = '📋 Copy';
      copyBtn.onclick = () => {
        navigator.clipboard.writeText(text).then(() => {
          copyBtn.classList.add('copied'); copyBtn.innerHTML = '✓ Copied';
          setTimeout(() => { copyBtn.classList.remove('copied'); copyBtn.innerHTML = '📋 Copy'; }, 1800);
        });
      };
      actionsBar.appendChild(copyBtn);

      // Read Aloud button (uses existing TTS)
      const speakBtn = document.createElement('button');
      speakBtn.className = 'msg-action-btn';
      speakBtn.innerHTML = '🔊 Read Aloud';
      speakBtn.onclick = () => {
        if (speakBtn.classList.contains('active')) { stopTtsGlobal(); speakBtn.classList.remove('active'); speakBtn.innerHTML = '🔊 Read Aloud'; return; }
        _unlockAudio();
        const prov = _ttsProvider !== 'off' ? _ttsProvider : 'inworld';
        const savedProv = _ttsProvider;
        _ttsProvider = prov;
        const metaTarget = el.querySelector('.msg-meta');
        speakBtn.classList.add('active'); speakBtn.innerHTML = '⏹ Stop';
        speakText(text, metaTarget).then(r => {
          _ttsProvider = savedProv;
          speakBtn.classList.remove('active'); speakBtn.innerHTML = '🔊 Read Aloud';
          if (r && !r.cached && metaTarget && apiCostStr !== null) {
            _updateMetaWithTts(metaTarget, apiCostStr, r.cost, r.provider, r.premium);
          }
        });
      };
      actionsBar.appendChild(speakBtn);

      // Continue button
      const contBtn = document.createElement('button');
      contBtn.className = 'msg-action-btn';
      contBtn.innerHTML = '▶ Continue';
      contBtn.onclick = () => continueResponse();
      actionsBar.appendChild(contBtn);

      // Regenerate button
      const regenBtn = document.createElement('button');
      regenBtn.className = 'msg-action-btn';
      regenBtn.innerHTML = '🔄 Regenerate';
      regenBtn.onclick = () => regenerateResponse(msgIdx);
      actionsBar.appendChild(regenBtn);

      el.appendChild(actionsBar);

      // Auto-play TTS if enabled
      if (_ttsProvider !== 'off' && d._live) {
        const metaEl = el.querySelector('.msg-meta');
        speakText(text, metaEl).then(r => {
          if (r && metaEl && apiCostStr !== null) _updateMetaWithTts(metaEl, apiCostStr, r.cost, r.provider, r.premium);
        });
      }

      // Show suggestion chips after live assistant messages
      if (d._live) generateSuggestions(text, agentName);

      break;
    }
    case 'system': {
      const el = document.createElement('div');
      el.className = 'chat-entry system-entry';
      el.textContent = text;
      thread.appendChild(el);
      break;
    }
    case 'error': {
      const el = document.createElement('div');
      el.className = 'chat-entry error-entry';
      el.innerHTML = `<span style="font-weight:600;">⚠</span> ${esc(text)}`;
      thread.appendChild(el);
      break;
    }
    case 'tick-start': {
      const d = data || {};
      document.querySelectorAll('.tick-section .tick-sub[open]').forEach(s => s.open = false);
      const det = document.createElement('details');
      det.className = 'tick-section'; det.open = true;
      const sum = document.createElement('summary');
      sum.className = 'tick-header';
      sum.innerHTML = `<span class="tick-label">Tick ${d.tick ?? '?'} / ${(d.total ?? 1) - 1}</span>
        <span class="tick-badge">running</span>
        <span class="tick-meta" id="tick-meta-${d.tick}"></span>`;
      det.appendChild(sum);
      const body = document.createElement('div');
      body.className = 'tick-body'; body.id = `tick-body-${d.tick}`;
      det.appendChild(body);
      thread.appendChild(det);
      _currentTickEl = det; _currentTickBody = body;
      break;
    }
    case 'tick-end': {
      const d = data || {};
      const meta = document.getElementById(`tick-meta-${d.tick}`);
      if (meta) {
        const tools = (d.tools || []).join(', ') || 'none';
        let cost = '';
        if (d.metering && d.metering.cost && d.metering.cost.total_cost > 0)
          cost = ` · $${d.metering.cost.total_cost.toFixed(4)}`;
        meta.textContent = `${d.steps || 0} steps · ${tools} · mem ${d.memories_written||0}/${d.memories_proposed||0}${cost}`;
      }
      const badge = _currentTickEl?.querySelector('.tick-badge');
      if (badge) { badge.textContent = d.stop_reason || 'done'; badge.style.background = 'rgba(16,185,129,0.12)'; badge.style.color = '#10b981'; }
      if (_currentTickEl) _currentTickEl.querySelectorAll('.tick-sub[open]').forEach(s => s.open = false);
      _currentTickEl = null; _currentTickBody = null;
      break;
    }
    case 'step': {
      const d = data || {};
      const target = _currentTickBody || thread;
      const action = d.action || 'think';
      let stepLabel = action;
      if (action === 'tool' && d.tool_name) stepLabel = d.tool_name;
      else if (action === 'stop') stepLabel = 'Stop' + (d.stop_reason ? ' — ' + d.stop_reason : '');
      else if (action === 'think') stepLabel = 'Think';

      const det = document.createElement('details');
      det.className = 'tick-sub sub-step'; det.open = true;
      const sum = document.createElement('summary');
      sum.innerHTML = `<span class="step-action-badge ${action}">${action}</span> ${esc(stepLabel)}`;
      det.appendChild(sum);
      const bodyDiv = document.createElement('div');
      bodyDiv.className = 'tick-sub-body';
      const el = document.createElement('div');
      el.className = `step-entry action-${action}`;
      let html = `<span class="step-summary">${esc(d.summary || '')}</span>`;
      if (action === 'tool' && d.tool_name) {
        html += `<div class="step-detail"><strong>${esc(d.tool_name)}</strong>`;
        if (d.tool_args) html += `\n${esc(JSON.stringify(d.tool_args, null, 2))}`;
        html += `</div>`;
      }
      if (action === 'stop' && d.stop_reason)
        html += `<div style="font-size:0.75rem; color:#10b981; margin-top:0.125rem;">↳ ${esc(d.stop_reason)}</div>`;
      el.innerHTML = html;
      bodyDiv.appendChild(el);
      det.appendChild(bodyDiv);
      target.querySelectorAll(':scope > .tick-sub[open]').forEach(s => s.open = false);
      target.appendChild(det);
      break;
    }
    case 'tool-result': {
      const d = data || {};
      const target = _currentTickBody || thread;
      const det = document.createElement('details');
      det.className = 'tick-sub sub-tool-result'; det.open = true;
      const sum = document.createElement('summary');
      sum.textContent = `↳ ${d.tool || 'Result'}`;
      det.appendChild(sum);
      const bodyDiv = document.createElement('div');
      bodyDiv.className = 'tick-sub-body';
      let resultStr = '';
      try { resultStr = JSON.stringify(typeof d.result === 'string' ? JSON.parse(d.result) : d.result, null, 2); }
      catch(e) { resultStr = String(d.result || ''); }
      if (resultStr.length > 800) resultStr = resultStr.slice(0, 800) + '\n… (truncated)';
      bodyDiv.innerHTML = `<div class="step-detail">${esc(resultStr)}</div>`;
      det.appendChild(bodyDiv);
      target.querySelectorAll(':scope > .tick-sub[open]').forEach(s => s.open = false);
      target.appendChild(det);
      break;
    }
    case 'memory-flush': {
      const d = data || {};
      const target = _currentTickBody || thread;
      const det = document.createElement('details');
      det.className = 'tick-sub sub-flush'; det.open = true;
      const sum = document.createElement('summary');
      sum.textContent = `Memory Flush — ${d.written||0}/${d.proposed||0} written`;
      det.appendChild(sum);
      const bodyDiv = document.createElement('div');
      bodyDiv.className = 'tick-sub-body';
      let html = '';
      if (d.items) {
        d.items.forEach(mem => {
          html += `<div class="memory-item"><span class="memory-item-text">${esc(mem.text)}</span>
            <span class="memory-item-meta">${mem.scope||''} · ${mem.category||''}</span></div>`;
        });
      }
      bodyDiv.innerHTML = html;
      det.appendChild(bodyDiv);
      target.querySelectorAll(':scope > .tick-sub[open]').forEach(s => s.open = false);
      target.appendChild(det);
      break;
    }
    default: {
      if (!text || !text.trim()) return;
      const target = _currentTickBody || thread;
      const el = document.createElement('div');
      el.className = 'chat-entry';
      el.style.cssText = 'padding:0.25rem 0.75rem; color:#a1a1aa; font-size:0.8125rem;';
      el.textContent = text;
      target.appendChild(el);
    }
  }
  thread.scrollTop = thread.scrollHeight;
}

function renderLayerRow(num, label, stat, preview) {
  const hasContent = preview && preview.trim().length > 0;
  const previewHtml = hasContent
    ? `<div class="layer-preview">${esc(preview)}</div>`
    : `<div class="layer-preview" style="color:#3f3f46;font-style:italic;">none injected</div>`;
  return `<div class="layer-row">
    <div class="layer-num layer-num-${num}">${num}</div>
    <div class="layer-info">
      <div><span class="layer-label">${label}</span><span class="layer-stat">${stat}</span></div>
      ${previewHtml}
    </div>
  </div>`;
}

function toggleLayers(id, btn) {
  const panel = document.getElementById(id);
  panel.classList.toggle('open');
  btn.classList.toggle('open');
}

function renderAll() {
  const thread = document.getElementById('chat-thread');
  thread.innerHTML = '';
  _currentTickEl = null; _currentTickBody = null;
  if (!_msgs.length) {
    thread.innerHTML = `<div class="empty-state" id="empty-state">
      <span class="empty-state-icon">⟡</span>
      <span class="text-sm">Send a message to start a session</span>
      <span class="text-xs text-zinc-600">Select an agent and mode from the toolbar below</span>
    </div>`;
    return;
  }
  _msgs.forEach(m => renderSavedMsg(m));
}

function pushMsg(role, text, data, layers) {
  const m = { role, text, time: new Date().toISOString() };
  if (data) m.data = data;
  if (layers) m.layers = layers;
  _msgs.push(m);
  renderSavedMsg(m);
}

// ═══════════════════════════════════════════
//  FORMAT HELPERS  (marked.js + highlight.js)
// ═══════════════════════════════════════════
const _markedRenderer = new marked.Renderer();
let _codeBlockId = 0;
_markedRenderer.code = function(code, language, isEscaped) {
  // marked v12+ passes an object; handle both shapes
  let text = code, lang = language;
  if (typeof code === 'object' && code !== null) { text = code.text ?? ''; lang = code.lang ?? ''; }
  lang = (lang || '').trim();
  const id = 'cb-' + (++_codeBlockId);
  let highlighted;
  try {
    highlighted = lang && hljs.getLanguage(lang)
      ? hljs.highlight(text, {language: lang, ignoreIllegals: true}).value
      : hljs.highlightAuto(text).value;
  } catch(e) { highlighted = esc(text); }
  return `<div class="code-block-wrap">
    <div class="code-block-header">
      <span class="code-block-lang">${esc(lang || 'code')}</span>
      <button class="code-copy-btn" onclick="copyCodeBlock('${id}',this)">📋 Copy</button>
    </div>
    <pre><code id="${id}" class="hljs ${lang ? 'language-' + esc(lang) : ''}">${highlighted}</code></pre>
  </div>`;
};
_markedRenderer.image = function(href, title, text) {
  // marked v12+ passes an object
  if (typeof href === 'object' && href !== null) {
    const tok = href;
    text = tok.text ?? ''; title = tok.title ?? ''; href = tok.href ?? '';
  }
  const t = title ? ` title="${esc(title)}"` : '';
  return `<img src="${href}" alt="${esc(text || '')}"${t} loading="lazy">`;
};
marked.setOptions({ renderer: _markedRenderer, gfm: true, breaks: true });

function copyCodeBlock(id, btn) {
  const el = document.getElementById(id);
  if (!el) return;
  navigator.clipboard.writeText(el.textContent).then(() => {
    btn.classList.add('copied'); btn.textContent = '✓ Copied';
    setTimeout(() => { btn.classList.remove('copied'); btn.textContent = '📋 Copy'; }, 1800);
  });
}

function formatAssistantText(text) {
  if (!text) return '';
  try { return marked.parse(text); }
  catch(e) {
    // Fallback: basic escaping
    let html = esc(text);
    html = html.replace(/\n/g, '<br>');
    return html;
  }
}

function _tryParseJson(prefix, line) {
  if (line.startsWith(prefix)) {
    try { return JSON.parse(line.slice(prefix.length)); } catch(e) {}
  }
  return null;
}

function _parseLineRole(line) {
  let d;
  if ((d = _tryParseJson('[step] ', line)))         return { role: 'step', data: d };
  if ((d = _tryParseJson('[tool-result] ', line)))   return { role: 'tool-result', data: d };
  if ((d = _tryParseJson('[memory-flush] ', line)))  return { role: 'memory-flush', data: d };
  if ((d = _tryParseJson('[tick-start] ', line)))    return { role: 'tick-start', data: d };
  if ((d = _tryParseJson('[tick-end] ', line)))      return { role: 'tick-end', data: d };
  if (line.startsWith('[burst] Done') || line.startsWith('[burst] Starting'))
    return { role: 'system', data: null };
  if (line.includes('ERROR') || /\berror\b/i.test(line))
    return { role: 'error', data: null };
  return { role: 'agent', data: null };
}

// ═══════════════════════════════════════════
//  CHAT MODE (direct LLM call)
// ═══════════════════════════════════════════
async function sendChatMsg() {
  const agent = document.getElementById('chat-agent').value;
  const stim  = document.getElementById('chat-stimulus').value.trim();
  if (!stim && !_attachedFiles.length) return;
  clearSuggestions();

  // Upload attached files
  const imageUrls = [];
  if (_attachedFiles.length) {
    for (const f of _attachedFiles) {
      const fd = new FormData();
      fd.append('file', f);
      try {
        const r = await fetch('/api/chat/upload', { method: 'POST', body: fd });
        if (r.ok) {
          const d = await r.json();
          if (f.type.startsWith('image/')) imageUrls.push(window.location.origin + d.url);
        }
      } catch(_) {}
    }
    _attachedFiles = [];
    renderAttachPreview();
  }

  const payload = {
    agent,
    stimulus: stim || '(see attached)',
    ..._buildChatRoutingPayload(),
    chat_id: _chatId,
  };
  if (imageUrls.length) payload.images = imageUrls;

  pushMsg('user', stim);
  document.getElementById('chat-stimulus').value = '';
  autoResize(document.getElementById('chat-stimulus'));

  const agentCap = agent.charAt(0).toUpperCase() + agent.slice(1);
  setBusy(true);

  const thread = document.getElementById('chat-thread');
  const _tav = _avatarMap[agent] || {};
  const _typColor = _tav.color || _agentAvatarColor(agent);
  const avatarHtml = _tav.image
    ? `<div class="msg-avatar"><img src="${_tav.image}" alt="${agentCap}"></div>`
    : `<div class="msg-avatar" style="background:${_typColor};">${agent.charAt(0).toUpperCase()}</div>`;

  // Build the assistant entry container (streaming fills it incrementally)
  const el = document.createElement('div');
  el.className = 'chat-entry assistant-entry';
  el.innerHTML = `<div class="msg-header">${avatarHtml}<span class="msg-name">${agentCap}</span><span class="msg-time">${new Date().toLocaleTimeString()}</span></div>
    <div class="msg-body-wrap"><div class="msg-body streaming-body" style="color:#71717a;">Thinking…</div></div>`;
  thread.appendChild(el);
  thread.scrollTop = thread.scrollHeight;

  const bodyEl = el.querySelector('.msg-body');
  let accText = '';          // accumulated response text (for markdown re-render)
  let thinkPanel = null;     // current thinking panel element
  let thinkBodyEl = null;    // inner body of the thinking panel
  let thinkStart = null;     // timestamp for "Thought for X s"
  let _renderTimer = null;   // debounce timer for markdown re-render
  let _streamDone = false;

  function _scheduleRender() {
    if (_renderTimer) return;
    _renderTimer = setTimeout(() => {
      _renderTimer = null;
      bodyEl.innerHTML = formatAssistantText(accText);
      if (!_streamDone) thread.scrollTop = thread.scrollHeight;
    }, 60);
  }

  function _openThinkPanel() {
    thinkPanel = document.createElement('div');
    thinkPanel.className = 'thinking-panel streaming';
    thinkPanel.innerHTML = `<div class="thinking-panel-header" onclick="this.parentElement.classList.toggle('collapsed')">
        <span class="chevron">▼</span> <span class="thinking-label">Thinking…</span></div>
      <div class="thinking-panel-body"></div>`;
    // Insert before the msg-body-wrap
    const wrap = el.querySelector('.msg-body-wrap');
    wrap.parentElement.insertBefore(thinkPanel, wrap);
    thinkBodyEl = thinkPanel.querySelector('.thinking-panel-body');
    thinkStart = Date.now();
    thread.scrollTop = thread.scrollHeight;
  }

  function _closeThinkPanel() {
    if (!thinkPanel) return;
    thinkPanel.classList.remove('streaming');
    thinkPanel.classList.add('collapsed');
    const secs = ((Date.now() - (thinkStart || Date.now())) / 1000).toFixed(1);
    thinkPanel.querySelector('.thinking-label').textContent = `Thought for ${secs}s`;
    thinkPanel = null; thinkBodyEl = null; thinkStart = null;
  }

  try {
    const resp = await fetch('/api/chat/stream', {
      method: 'POST', headers: {'Content-Type':'application/json'},
      body: JSON.stringify(payload),
    });

    if (!resp.ok) {
      let errText = 'API error ' + resp.status;
      try { const ej = await resp.json(); errText = ej.error || errText; } catch(_){}
      el.remove();
      pushMsg('error', errText);
      setBusy(false);
      return;
    }

    // Remove placeholder text
    bodyEl.style.color = '';
    bodyEl.textContent = '';

    const reader = resp.body.getReader();
    const decoder = new TextDecoder();
    let sseBuffer = '';
    let finalData = null;

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      sseBuffer += decoder.decode(value, { stream: true });

      // Process complete SSE lines
      const lines = sseBuffer.split('\n');
      sseBuffer = lines.pop(); // keep incomplete line in buffer

      for (const line of lines) {
        if (!line.startsWith('data: ')) continue;
        let evt;
        try { evt = JSON.parse(line.slice(6)); } catch(_){ continue; }

        switch (evt.type) {
          case 'thinking_start':
            _openThinkPanel();
            // hide main body while only thinking
            if (!accText) bodyEl.style.display = 'none';
            break;

          case 'thinking':
            if (thinkBodyEl) {
              thinkBodyEl.textContent += evt.content;
              thread.scrollTop = thread.scrollHeight;
            }
            break;

          case 'thinking_done':
            _closeThinkPanel();
            break;

          case 'text':
            if (bodyEl.style.display === 'none') bodyEl.style.display = '';
            accText += evt.content;
            _scheduleRender();
            break;

          case 'tool_start': {
            const toolNote = document.createElement('div');
            toolNote.className = 'stream-tool-note';
            toolNote.innerHTML = `⚡ Calling <strong>${esc(evt.tool)}</strong>…`;
            el.appendChild(toolNote);
            thread.scrollTop = thread.scrollHeight;
            break;
          }

          case 'tool_result': {
            const notes = el.querySelectorAll('.stream-tool-note');
            const last = notes[notes.length - 1];
            if (last) last.innerHTML = `⚡ <strong>${esc(evt.tool)}</strong> → ${esc((evt.result||'').substring(0, 120))}`;
            break;
          }

          case 'error':
            _streamDone = true;
            el.remove();
            pushMsg('error', evt.message || 'Stream error');
            setBusy(false);
            return;

          case 'done':
            finalData = evt;
            break;
        }
      }
    }

    // Close any still-open thinking panel
    _closeThinkPanel();
    _streamDone = true;

    // Final markdown render
    if (_renderTimer) { clearTimeout(_renderTimer); _renderTimer = null; }
    const responseText = finalData?.response || accText;
    accText = responseText;
    bodyEl.style.display = '';
    bodyEl.innerHTML = formatAssistantText(responseText);
    bodyEl.classList.remove('streaming-body');

    // Remove inline tool notes (final tool calls panel replaces them)
    el.querySelectorAll('.stream-tool-note').forEach(n => n.remove());

    if (!finalData) { setBusy(false); return; }

    // Update chat ID
    if (!_chatId && finalData.chat_id) {
      _chatId = finalData.chat_id;
      _index.chats.unshift({
        id: finalData.chat_id, title: 'New Chat', folder_id: null,
        agent, mode: 'chat', created: new Date().toISOString(),
        updated: new Date().toISOString(),
      });
      renderSidebar();
    }
    document.getElementById('chat-title').textContent = agentCap;

    // Add metadata (model, usage, cost)
    const d = finalData;
    if (d.usage || d.model) {
      const parts = [];
      if (d.model) parts.push(d.model);
      if (d.usage) {
        if (d.usage.prompt_tokens) parts.push(`In: ${d.usage.prompt_tokens.toLocaleString()}`);
        if (d.usage.completion_tokens) parts.push(`Out: ${d.usage.completion_tokens.toLocaleString()}`);
      }
      const cost = d.cost?.total_cost || null;
      let apiCostStr = null;
      if (cost !== null) {
        apiCostStr = typeof cost === 'number' ? cost.toFixed(6) : cost;
        parts.push(`<span class="meta-cost">API $${apiCostStr}</span>`);
      }
      const metaDiv = document.createElement('div');
      metaDiv.className = 'msg-meta';
      metaDiv.innerHTML = parts.join(' · ');
      el.appendChild(metaDiv);
    }

    // Generated image
    if (d.generated_image && d.generated_image.url) {
      const gi = d.generated_image;
      const imgDiv = document.createElement('div');
      imgDiv.className = 'msg-generated-image';
      imgDiv.style.cssText = 'margin:0.75rem 0 0.5rem; max-width:512px;';
      imgDiv.innerHTML = `<img src="${gi.url}" alt="${esc((gi.prompt||'').substring(0,120))}"
          style="width:100%; border-radius:0.5rem; cursor:pointer; border:1px solid rgba(255,255,255,0.08);"
          onclick="window.open(this.src,'_blank')" title="Click to open full size">
        <div style="display:flex; align-items:center; gap:0.375rem; margin-top:0.375rem; font-size:0.7rem; color:#71717a;">
          <span>🎨</span><span>${esc(gi.provider||'')}</span></div>`;
      el.appendChild(imgDiv);
    }

    // Generated video
    if (d.generated_video) {
      const gv = d.generated_video;
      if (gv.url) {
        const provLabel = gv.provider || 'google_veo';
        const provDisplay = {'google_veo2':'Veo 2','google_veo3':'Veo 3','google_veo31':'Veo 3.1'}[provLabel] || provLabel;
        const vidDiv = document.createElement('div');
        vidDiv.className = 'msg-generated-video';
        vidDiv.style.cssText = 'margin:0.75rem 0 0.5rem; max-width:640px;';
        vidDiv.innerHTML = `<video src="${gv.url}" controls preload="metadata"
              style="width:100%; border-radius:0.5rem; border:1px solid rgba(255,255,255,0.08); background:#000;">
            Your browser does not support the video tag.
          </video>
          <div style="display:flex; align-items:center; gap:0.375rem; margin-top:0.375rem; font-size:0.7rem; color:#71717a;">
            <span>🎬</span><span>${esc(provDisplay)}</span>
            <a href="${gv.url}" download style="color:#818cf8; text-decoration:none; margin-left:0.5rem;">⬇ Download</a>
          </div>`;
        el.appendChild(vidDiv);
      } else if (gv.error) {
        const errDiv = document.createElement('div');
        errDiv.className = 'msg-generated-video-error';
        errDiv.style.cssText = 'margin:0.75rem 0 0.5rem; padding:0.625rem 0.75rem; border:1px solid rgba(244,63,94,0.35); border-radius:0.5rem; background:rgba(244,63,94,0.08); color:#fecdd3; font-size:0.78rem; max-width:640px;';
        errDiv.textContent = `🎬 Video generation failed: ${gv.error}`;
        el.appendChild(errDiv);
      }
    }

    // Tool calls panel
    if (d.tool_calls && d.tool_calls.length > 0) {
      const tcId = 'tc-' + Date.now() + Math.random().toString(36).slice(2,6);
      const tcEl = document.createElement('div');
      tcEl.style.cssText = 'margin-left:3.5rem;margin-top:0.25rem;';
      let entriesHtml = d.tool_calls.map(tc =>
        `<div class="tool-call-entry"><span class="tool-call-name">⚡ ${esc(tc.tool)}</span><span class="tool-call-round">round ${tc.round}</span>
        <div class="tool-call-args">${esc(JSON.stringify(tc.arguments))}</div>
        <div class="tool-call-result">${esc(tc.result)}</div></div>`
      ).join('');
      tcEl.innerHTML = `<button class="tool-calls-badge" onclick="let p=document.getElementById('${tcId}');p.classList.toggle('open');this.classList.toggle('open');">⚡ ${d.tool_calls.length} tool call${d.tool_calls.length===1?'':'s'}</button>
        <div class="tool-calls-panel" id="${tcId}">${entriesHtml}</div>`;
      el.appendChild(tcEl);
    }

    // Prompt layers
    if (d.layers) {
      const layerId = 'layers-' + Date.now() + Math.random().toString(36).slice(2,6);
      const layers = d.layers;
      const toolChars = (layers.tools?.names||[]).reduce((s,n) => s + n.length + 20, 0) * (layers.tools?.count||0 ? 1 : 0);
      const total = (layers.base_prompt?.chars||0) + (layers.soul_script?.chars||0)
                  + (layers.always_on?.chars||0) + (layers.vault?.chars||0) + (layers.conversation?.chars||0) + toolChars;
      const pct = (c) => total > 0 ? Math.max(2, Math.round(c / total * 100)) : 0;
      const lDiv = document.createElement('div');
      lDiv.innerHTML = `<button class="layers-toggle" onclick="toggleLayers('${layerId}', this)">◇ Prompt Layers</button>
        <div class="layer-bar" id="bar-${layerId}">
          <div class="layer-bar-seg layer-bar-1" style="width:${pct(layers.base_prompt?.chars||0)}%"></div>
          <div class="layer-bar-seg layer-bar-2" style="width:${pct(layers.soul_script?.chars||0)}%"></div>
          <div class="layer-bar-seg layer-bar-3" style="width:${pct(layers.always_on?.chars||0)}%"></div>
          <div class="layer-bar-seg layer-bar-4" style="width:${pct(layers.vault?.chars||0)}%"></div>
          <div class="layer-bar-seg layer-bar-5" style="width:${pct(layers.conversation?.chars||0)}%"></div>
          <div class="layer-bar-seg layer-bar-6" style="width:${pct(toolChars)}%"></div>
        </div>
        <div class="layers-panel" id="${layerId}">
          ${renderLayerRow(1, 'Base Prompt', layers.base_prompt?.chars + ' chars', layers.base_prompt?.preview)}
          ${renderLayerRow(2, 'Soul Script', layers.soul_script?.chunks + ' chunks · ' + layers.soul_script?.chars + ' chars', layers.soul_script?.preview)}
          ${renderLayerRow(3, 'Always-On Knowledge', layers.always_on?.chunks + ' notes · ' + layers.always_on?.chars + ' chars', layers.always_on?.preview)}
          ${renderLayerRow(4, 'Memory Vault', layers.vault?.memories + ' memories · ' + layers.vault?.chars + ' chars', (layers.vault?.snippets||[]).join('\\n---\\n'))}
          ${renderLayerRow(5, 'Conversation', layers.conversation?.turns + ' turns · ' + layers.conversation?.chars + ' chars', '')}
          ${renderLayerRow(6, 'Tool Registry', layers.tools?.count + ' tools', (layers.tools?.names||[]).join(', '))}
        </div>`;
      el.appendChild(lDiv);
    }

    // Action bar (Copy, Read Aloud, Continue, Regenerate)
    const actionsBar = document.createElement('div');
    actionsBar.className = 'msg-actions';
    const copyBtn = document.createElement('button');
    copyBtn.className = 'msg-action-btn'; copyBtn.innerHTML = '📋 Copy';
    copyBtn.onclick = () => {
      navigator.clipboard.writeText(responseText).then(() => {
        copyBtn.classList.add('copied'); copyBtn.innerHTML = '✓ Copied';
        setTimeout(() => { copyBtn.classList.remove('copied'); copyBtn.innerHTML = '📋 Copy'; }, 1800);
      });
    };
    actionsBar.appendChild(copyBtn);
    const speakBtn = document.createElement('button');
    speakBtn.className = 'msg-action-btn'; speakBtn.innerHTML = '🔊 Read Aloud';
    speakBtn.onclick = () => {
      if (speakBtn.classList.contains('active')) { stopTtsGlobal(); speakBtn.classList.remove('active'); speakBtn.innerHTML = '🔊 Read Aloud'; return; }
      _unlockAudio();
      const prov = _ttsProvider !== 'off' ? _ttsProvider : 'edge';
      const savedProv = _ttsProvider; _ttsProvider = prov;
      const metaTarget = el.querySelector('.msg-meta');
      speakBtn.classList.add('active'); speakBtn.innerHTML = '⏹ Stop';
      speakText(responseText, metaTarget).then(r => {
        _ttsProvider = savedProv; speakBtn.classList.remove('active'); speakBtn.innerHTML = '🔊 Read Aloud';
      });
    };
    actionsBar.appendChild(speakBtn);
    const contBtn = document.createElement('button');
    contBtn.className = 'msg-action-btn'; contBtn.innerHTML = '▶ Continue';
    contBtn.onclick = () => continueResponse();
    actionsBar.appendChild(contBtn);
    const regenBtn = document.createElement('button');
    regenBtn.className = 'msg-action-btn'; regenBtn.innerHTML = '🔄 Regenerate';
    regenBtn.onclick = () => regenerateResponse(_msgs.length);
    actionsBar.appendChild(regenBtn);
    el.appendChild(actionsBar);

    // Save to _msgs for history
    const msgData = {agent, model: d.model||'', usage: d.usage||{}, cost: d.cost||{}, tool_calls: d.tool_calls||[], generated_image: d.generated_image||null, generated_video: d.generated_video||null, _live: true};
    const m = { role: 'assistant', text: responseText, time: new Date().toISOString(), data: msgData, layers: d.layers };
    _msgs.push(m);

    // Memory save indicator
    if (d.saved_memories && d.saved_memories.length > 0) {
      const memEl = document.createElement('div');
      memEl.style.cssText = 'padding:0.375rem 0.75rem;margin:0.25rem 0 0.5rem;border-radius:0.375rem;background:rgba(16,185,129,0.1);border:1px solid rgba(16,185,129,0.25);color:#6ee7b7;font-size:0.75rem;display:flex;align-items:center;gap:0.375rem;';
      const count = d.saved_memories.length;
      memEl.innerHTML = `<span style="font-size:0.875rem;">💾</span> ${count} memor${count===1?'y':'ies'} saved to vault`;
      thread.appendChild(memEl);
    }

    // Update session cost
    _sessionCost += (d.cost?.total_cost || 0);
    _sessionTokens += ((d.usage?.prompt_tokens||0) + (d.usage?.completion_tokens||0));
    if (d.credits) {
      if (d.credits.credits_deducted > 0) _sessionCredits += d.credits.credits_deducted;
      if (d.credits.credits_balance !== undefined && d.credits.credits_balance >= 0) updateCreditBalance(d.credits.credits_balance);
    }
    updateCostTicker();

    // Auto-play TTS if enabled
    if (_ttsProvider !== 'off') {
      speakText(responseText, el.querySelector('.msg-meta')).then(r => {
        if (r && r.cost > 0) m.data.tts_cost = (m.data.tts_cost || 0) + r.cost;
      });
    }

    generateSuggestions(responseText, agent);
    autoTitle();
    setBusy(false);

  } catch (e) {
    el.remove();
    pushMsg('error', 'Chat error: ' + e);
    setBusy(false);
  }
}

// ═══════════════════════════════════════════
//  CONTINUE / REGENERATE / SUGGESTIONS
// ═══════════════════════════════════════════

/** Send "Continue" — asks the agent to keep going from where it left off */
async function continueResponse() {
  const textarea = document.getElementById('chat-stimulus');
  textarea.value = 'Continue from where you left off.';
  await sendChatMsg();
}

/** Regenerate the last assistant response */
async function regenerateResponse(msgIdx) {
  // Find the last user message to re-send
  let lastUserText = null;
  for (let i = _msgs.length - 1; i >= 0; i--) {
    if (_msgs[i].role === 'user') { lastUserText = _msgs[i].text; break; }
  }
  if (!lastUserText) return;

  // Remove the last assistant message from DOM + array
  const thread = document.getElementById('chat-thread');
  const assistantEntries = thread.querySelectorAll('.assistant-entry');
  if (assistantEntries.length > 0) {
    const last = assistantEntries[assistantEntries.length - 1];
    // Also remove associated elements (action bar, tool calls, etc.) that are siblings
    let sibling = last.nextElementSibling;
    while (sibling && !sibling.classList.contains('chat-entry')) {
      const next = sibling.nextElementSibling;
      sibling.remove();
      sibling = next;
    }
    last.remove();
  }
  // Remove from messages array (pop last assistant)
  for (let i = _msgs.length - 1; i >= 0; i--) {
    if (_msgs[i].role === 'assistant') { _msgs.splice(i, 1); break; }
  }
  // Also remove the user msg we're about to re-send
  for (let i = _msgs.length - 1; i >= 0; i--) {
    if (_msgs[i].role === 'user') { _msgs.splice(i, 1); break; }
  }
  const userEntries = thread.querySelectorAll('.user-entry');
  if (userEntries.length > 0) userEntries[userEntries.length - 1].remove();

  // Re-send
  document.getElementById('chat-stimulus').value = lastUserText;
  await sendChatMsg();
}

/** Generate and display suggestion chips after assistant response */
function generateSuggestions(assistantText, agentName) {
  clearSuggestions();
  const bar = document.getElementById('suggestion-chips');
  if (!bar) return;

  // Build contextual suggestions from assistant reply
  const suggestions = _buildSuggestions(assistantText);
  if (!suggestions.length) return;

  suggestions.forEach(s => {
    const chip = document.createElement('button');
    chip.className = 'suggestion-chip';
    chip.textContent = s;
    chip.onclick = () => useSuggestion(s);
    bar.appendChild(chip);
  });
  bar.style.display = 'flex';
}

function clearSuggestions() {
  const bar = document.getElementById('suggestion-chips');
  if (bar) { bar.innerHTML = ''; bar.style.display = 'none'; }
}

function useSuggestion(text) {
  const textarea = document.getElementById('chat-stimulus');
  textarea.value = text;
  autoResize(textarea);
  clearSuggestions();
  runChat();
}

/**
 * Build 3-4 contextual suggestion chips from the assistant's last response.
 * Uses simple heuristics — detects questions, topics, and offers generic follow-ups.
 */
function _buildSuggestions(text) {
  const suggestions = [];
  const lower = text.toLowerCase();

  // If the assistant asked a question, offer direct answer-type responses
  const hasQuestion = /\?/.test(text.slice(-300));

  if (hasQuestion) {
    suggestions.push('Yes, go ahead');
    suggestions.push('No, let\'s try something else');
  }

  // Detect code in response
  if (/```/.test(text)) {
    suggestions.push('Explain this code step by step');
    if (!hasQuestion) suggestions.push('Can you improve this code?');
  }

  // Detect lists / steps
  if (/^\s*[\d\-•]\s/m.test(text)) {
    suggestions.push('Elaborate on these points');
  }

  // Generic follow-ups
  if (suggestions.length < 3) suggestions.push('Tell me more');
  if (suggestions.length < 4) suggestions.push('Summarize this');
  if (suggestions.length < 4 && !hasQuestion) suggestions.push('Give me an example');

  return suggestions.slice(0, 4);
}

// ═══════════════════════════════════════════
//  CHAT EXECUTION (routes by mode)
// ═══════════════════════════════════════════
async function runChat() {
  if (_mode === 'chat') return sendChatMsg();

  // ── Burst mode ──
  const agent = document.getElementById('chat-agent').value;
  const stim  = document.getElementById('chat-stimulus').value.trim();
  if (!stim) return;
  clearSuggestions();

  const payload = {
    agent,
    stimulus: stim,
    mode: _mode,
    burst_ticks:   4,
    max_steps:     3,
    ..._buildChatRoutingPayload(),
    chat_id:       _chatId,
  };

  pushMsg('user', stim);
  document.getElementById('chat-stimulus').value = '';
  autoResize(document.getElementById('chat-stimulus'));

  const agentCap = agent.charAt(0).toUpperCase() + agent.slice(1);
  setBusy(true);

  // Render agent header for burst
  const modeLabel = `Burst · ${payload.burst_ticks} ticks · ${payload.max_steps} steps`;
  {
    const thread = document.getElementById('chat-thread');
    const empty = document.getElementById('empty-state');
    if (empty) empty.style.display = 'none';
    const av = _avatarMap[agent] || {};
    const avatarColor = av.color || _agentAvatarColor(agent);
    const avatarHtml = av.image
      ? `<div class="msg-avatar"><img src="${av.image}" alt="${agentCap}"></div>`
      : `<div class="msg-avatar" style="background:${avatarColor};">${agent.charAt(0).toUpperCase()}</div>`;
    const el = document.createElement('div');
    el.className = 'chat-entry assistant-entry';
    el.innerHTML = `<div class="msg-header">${avatarHtml}<span class="msg-name">${agentCap}</span>
      <span class="msg-time">${new Date().toLocaleTimeString()}</span>
      <span class="msg-meta" style="margin:0; display:inline-flex;">${modeLabel}</span>
    </div>`;
    thread.appendChild(el);
    thread.scrollTop = thread.scrollHeight;
    _msgs.push({ role: 'system', text: `Starting ${agentCap} — ${modeLabel}`, time: new Date().toISOString() });
  }

  try {
    const resp = await fetch('/api/chat/run', {
      method: 'POST', headers: {'Content-Type':'application/json'},
      body: JSON.stringify(payload),
    });
    const data = await resp.json();
    if (data.error) { pushMsg('error', data.error); setBusy(false); return; }

    _sessionId = data.session_id;
    if (!_chatId) {
      _chatId = data.chat_id;
      _index.chats.unshift({
        id: data.chat_id, title: 'New Chat', folder_id: null,
        agent, mode: _mode, created: new Date().toISOString(),
        updated: new Date().toISOString(),
      });
      renderSidebar();
    }

    document.getElementById('chat-title').textContent = agentCap;
    setStatus('running');
    startPoll(data.session_id, agent);
  } catch (e) {
    pushMsg('error', 'Failed to start: ' + e);
    setBusy(false);
  }
}

function startPoll(sid, agent) {
  if (_poll) clearInterval(_poll);
  _poll = setInterval(async () => {
    try {
      const resp = await fetch(`/api/chat/status/${sid}`);
      const data = await resp.json();
      if (data.new_lines && data.new_lines.length) {
        data.new_lines.forEach(line => {
          if (!line.trim()) return;
          const { role, data: d } = _parseLineRole(line);
          pushMsg(role, line, d);
        });
      }
      if (data.status !== 'running') {
        clearInterval(_poll); _poll = null;
        setStatus(data.status);
        if (data.status === 'completed') {
          pushMsg('system', 'Session complete');
          autoTitle();
        }
        setBusy(false);
      }
    } catch (e) {
      clearInterval(_poll); _poll = null;
      pushMsg('error', 'Connection lost: ' + e);
      setBusy(false);
    }
  }, 1500);
}

async function stopChat() {
  if (!_sessionId) return;
  try {
    await fetch(`/api/chat/stop/${_sessionId}`, {method:'POST'});
    if (_poll) { clearInterval(_poll); _poll = null; }
    setStatus('stopped');
    pushMsg('system', 'Session stopped');
    setBusy(false);
  } catch (e) { pushMsg('error', 'Stop error: ' + e); }
}

// ═══════════════════════════════════════════
//  AI TITLE + EMOJI GENERATION
// ═══════════════════════════════════════════
async function autoTitle() {
  if (!_chatId) return;
  const c = _index.chats.find(x => x.id === _chatId);
  if (c && c.title && c.title !== 'New Chat') return;
  try {
    const resp = await fetch(`/api/chat/${_chatId}/title`, {method: 'POST'});
    const data = await resp.json();
    if (data.title) {
      document.getElementById('chat-title').textContent = data.title;
      if (c) c.title = data.title;
      renderSidebar();
      autoEmoji();
    }
  } catch (e) {}
}

async function autoEmoji() {
  if (!_chatId) return;
  const c = _index.chats.find(x => x.id === _chatId);
  if (c && c.emoji) return;
  try {
    const resp = await fetch(`/api/chats/${_chatId}/emoji`, {method: 'POST'});
    const data = await resp.json();
    if (data.emoji) {
      if (c) c.emoji = data.emoji;
      renderSidebar();
    }
  } catch (e) {}
}

// ═══════════════════════════════════════════
//  UI HELPERS
// ═══════════════════════════════════════════
function setBusy(b) {
  document.getElementById('btn-send').style.display = b ? 'none' : '';
  document.getElementById('btn-stop').style.display = b ? '' : 'none';
  document.getElementById('btn-send').disabled = b;
}
function setStatus(s) {
  const el = document.getElementById('session-status');
  el.textContent = s;
  el.className = 'badge text-xs ' + ({
    running:'badge-category', completed:'badge-scope',
    error:'badge-risk-high', stopped:'badge-type', idle:'badge-scope'
  }[s] || 'badge-scope');
}
</script>
{% endblock %}
