{% extends "base.html" %}
{% block title %}Chat — SoulScript Engine{% endblock %}

{% block content %}
<style>
  /* ── Two-panel layout ── */
  .chat-layout {
    display: flex;
    height: 100vh;
    margin: -1rem -1.5rem;  /* exactly counteract main-content padding */
  }

  /* ── History Sidebar ── */
  .chat-sidebar {
    width: 260px;
    min-width: 260px;
    background: #13131a;
    border-right: 1px solid #2a2a3a;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    flex-shrink: 0;
  }
  .chat-sidebar.collapsed { width: 0; min-width: 0; border: none; }

  .sidebar-header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 0.75rem 1rem;
    border-bottom: 1px solid #2a2a3a;
  }
  .sidebar-scroll {
    flex: 1; overflow-y: auto; padding: 0.5rem;
    scrollbar-width: thin; scrollbar-color: #2a2a3a transparent;
  }
  .sidebar-scroll::-webkit-scrollbar { width: 5px; }
  .sidebar-scroll::-webkit-scrollbar-thumb { background: #2a2a3a; border-radius: 3px; }

  .sb-section-label {
    font-size: 0.6875rem; font-weight: 600; color: #52525b;
    text-transform: uppercase; letter-spacing: 0.05em;
    padding: 0.5rem 0.5rem 0.25rem; margin-top: 0.5rem;
    position: relative;
  }

  /* Folder row */
  .sb-folder {
    display: flex; align-items: center; gap: 0.375rem;
    padding: 0.375rem 0.5rem; border-radius: 0.375rem;
    cursor: pointer; color: #a1a1aa; font-size: 0.8125rem;
    transition: background 0.1s;
  }
  .sb-folder:hover { background: rgba(99,102,241,0.08); }
  .sb-folder-icon { font-size: 0.8125rem; color: #52525b; transition: transform 0.15s; line-height: 1; }
  .sb-folder-icon.open { transform: rotate(90deg); }
  .sb-folder-chats { padding-left: 1.25rem; }

  /* Chat item */
  .sb-chat {
    display: flex; align-items: center; gap: 0.375rem;
    padding: 0.375rem 0.5rem; border-radius: 0.375rem;
    cursor: pointer; color: #d4d4d8; font-size: 0.8125rem;
    transition: background 0.1s; position: relative;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .sb-chat:hover { background: rgba(99,102,241,0.08); }
  .sb-chat.active { background: rgba(99,102,241,0.15); color: #818cf8; }
  .sb-chat-icon { font-size: 0.7rem; flex-shrink: 0; }
  .sb-chat-title { flex: 1; overflow: hidden; text-overflow: ellipsis; }
  .sb-chat-menu {
    opacity: 0; background: none; border: none; color: #71717a;
    cursor: pointer; font-size: 0.875rem; padding: 0 0.25rem;
    flex-shrink: 0;
  }
  .sb-chat-age {
    font-size: 0.625rem; color: #52525b; flex-shrink: 0;
    white-space: nowrap; min-width: 1.5rem; text-align: right;
  }
  .sb-chat:hover .sb-chat-menu { opacity: 1; }
  .sb-chat:hover .sb-chat-age { display: none; }
  .sb-folder:hover .sb-chat-menu { opacity: 1; }
  .sb-add-folder {
    position: absolute; right: 0.25rem; top: 50%; transform: translateY(-50%);
    opacity: 0; background: none; border: none; color: #71717a;
    cursor: pointer; font-size: 0.875rem; padding: 0 0.25rem;
    transition: opacity 0.15s;
  }
  .sb-section-label:hover .sb-add-folder { opacity: 1; }
  .sb-add-folder:hover { color: #a1a1aa; }

  /* Drag visual */
  .sb-chat.dragging { opacity: 0.4; }
  .sb-folder.drag-over { background: rgba(99,102,241,0.2); outline: 1px dashed #6366f1; }

  /* ── Main chat panel ── */
  .chat-main {
    flex: 1; display: flex; flex-direction: column;
    min-width: 0; max-width: 100%;
    position: relative;
  }
  /* Background image with darkening overlay */
  .chat-bg-overlay {
    position: absolute; inset: 0; z-index: 0;
    background-size: cover; background-position: center;
    pointer-events: none;
  }
  .chat-bg-overlay::after {
    content: ''; position: absolute; inset: 0;
    background: rgba(10, 10, 15, 0.65);
  }
  .chat-container {
    display: flex;
    flex-direction: column;
    height: 100%;
    max-width: 56rem;
    margin: 0 auto;
    padding: 0 1.5rem;
    width: 100%;
    position: relative;
    z-index: 1;
  }

  /* Top bar */
  .chat-topbar {
    display: flex; align-items: center; justify-content: space-between;
    padding: 0.625rem 0; border-bottom: 1px solid rgba(42,42,58,0.6); flex-shrink: 0;
  }

  /* Scrollable thread */
  .chat-thread {
    flex: 1; overflow-y: auto; padding: 1.25rem 0;
    scrollbar-width: thin; scrollbar-color: #2a2a3a transparent;
  }
  .chat-thread::-webkit-scrollbar { width: 6px; }
  .chat-thread::-webkit-scrollbar-track { background: transparent; }
  .chat-thread::-webkit-scrollbar-thumb { background: #2a2a3a; border-radius: 3px; }

  /* ── Message entries ── */
  .chat-entry { margin-bottom: 1.25rem; }
  .chat-entry.assistant-entry { max-width: 88%; }
  .chat-entry.user-entry {
    max-width: 88%;
    margin-left: auto;
  }
  .chat-entry.system-entry {
    padding: 0.375rem 0.75rem;
    color: #71717a; font-size: 0.8125rem; text-align: center;
    border-top: 1px solid rgba(42,42,58,0.4);
    border-bottom: 1px solid rgba(42,42,58,0.4);
    margin: 0.5rem 0;
  }
  .chat-entry.error-entry {
    padding: 0.375rem 0.75rem;
    border-left: 3px solid #ef4444;
    color: #fca5a5; font-size: 0.8125rem;
  }

  @keyframes fadeInOut {
    0% { opacity:0; transform:translateY(-8px); }
    10% { opacity:1; transform:translateY(0); }
    80% { opacity:1; }
    100% { opacity:0; }
  }

  /* Header row */
  .msg-header {
    display: flex; align-items: center; gap: 0.5rem;
    margin-bottom: 0.25rem;
  }
  .msg-avatar {
    width: 3rem; height: 3rem; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 1.25rem; font-weight: 700; color: #fff; flex-shrink: 0;
    text-transform: uppercase; background-size: cover; background-position: center;
    overflow: hidden;
  }
  .msg-avatar img { width: 100%; height: 100%; object-fit: cover; border-radius: 50%; }
  .msg-name { font-size: 1.5rem; font-weight: 600; color: #a1a1aa; }
  .msg-time { font-size: 0.625rem; color: #3f3f46; }
  .user-entry .msg-header { justify-content: flex-end; }
  .msg-body-wrap {
    margin-left: 3.5rem;
    margin-top: 0.125rem;
  }
  .user-entry .msg-body-wrap {
    margin-left: 0;
    margin-right: 3.5rem;
    display: flex;
    justify-content: flex-end;
  }
  .msg-body {
    font-size: 0.875rem; line-height: 1.65;
    word-break: break-word;
    color: #d4d4d8;
    background: rgba(99,102,241,0.12);
    border: 1px solid rgba(99,102,241,0.15);
    border-radius: 0.625rem;
    padding: 0.5rem 0.75rem;
  }
  .user-entry .msg-body {
    white-space: pre-wrap;
  }
  .user-entry .msg-body {
    color: #d1fae5;
    background: rgba(16,185,129,0.12);
    border-color: rgba(16,185,129,0.15);
    width: fit-content;
    max-width: 100%;
    text-align: right;
  }
  .msg-meta {
    margin-top: 0.375rem; margin-left: 3.5rem;
    display: inline-flex; align-items: center; gap: 0.375rem;
    background: rgba(0,0,0,0.25);
    border: 1px solid rgba(42,42,58,0.5);
    border-radius: 0.375rem;
    padding: 0.1875rem 0.5rem;
    font-size: 0.6875rem; color: #52525b;
  }
  .msg-meta .meta-cost { color: #10b981; font-weight: 600; }

  /* Code blocks */
  .assistant-code {
    background: rgba(0,0,0,0.3);
    border: 1px solid rgba(63,63,70,0.5);
    border-radius: 0.375rem;
    padding: 0.5rem 0.75rem;
    margin: 0.375rem 0;
    overflow-x: auto; font-size: 0.8125rem; display: block;
  }
  .assistant-inline-code {
    background: rgba(0,0,0,0.25);
    padding: 0.125rem 0.25rem;
    border-radius: 0.25rem; font-size: 0.85em;
  }

  /* Typing animation */
  .typing-indicator .msg-body,
  .streaming-body {
    animation: pulse 1.5s ease-in-out infinite;
  }
  @keyframes pulse {
    0%, 100% { opacity: 0.5; }
    50% { opacity: 1; }
  }

  /* ── Collapsible thinking panel (streaming) ── */
  .thinking-panel {
    margin-left: 3.5rem; margin-top: 0.25rem; margin-bottom: 0.25rem;
    border-left: 2px solid #6366f1;
    border-radius: 0 0.375rem 0.375rem 0;
    background: rgba(99,102,241,0.04);
    overflow: hidden;
    transition: background 0.2s;
  }
  .thinking-panel-header {
    display: flex; align-items: center; gap: 0.375rem;
    padding: 0.375rem 0.625rem;
    cursor: pointer; user-select: none;
    font-size: 0.8125rem; color: #a5b4fc;
  }
  .thinking-panel-header:hover { background: rgba(99,102,241,0.08); }
  .thinking-panel-header .chevron {
    font-size: 0.5rem; transition: transform 0.15s;
  }
  .thinking-panel.collapsed .chevron { transform: rotate(-90deg); }
  .thinking-panel-body {
    padding: 0.25rem 0.625rem 0.375rem;
    font-size: 0.8125rem; line-height: 1.5;
    color: #94a3b8; white-space: pre-wrap; word-break: break-word;
    max-height: 20rem; overflow-y: auto;
  }
  .thinking-panel.collapsed .thinking-panel-body { display: none; }
  .thinking-panel.streaming .thinking-panel-header {
    animation: pulse 1.5s ease-in-out infinite;
  }

  /* Inline tool note during streaming */
  .stream-tool-note {
    margin-left: 3.5rem; margin-top: 0.25rem;
    padding: 0.25rem 0.625rem;
    font-size: 0.8125rem; color: #f59e0b;
    border-left: 2px solid rgba(245,158,11,0.4);
  }

  /* ── Tick section (collapsible) ── */
  .tick-section { margin: 0.75rem 0; }
  .tick-header {
    display: flex; align-items: center; gap: 0.5rem;
    padding: 0.5rem 0.75rem;
    background: rgba(34,211,238,0.04);
    border: 1px solid rgba(34,211,238,0.1);
    border-radius: 0.5rem;
    cursor: pointer; user-select: none;
    transition: background 0.15s;
    list-style: none;
  }
  .tick-header:hover { background: rgba(34,211,238,0.08); }
  .tick-header::-webkit-details-marker { display: none; }
  .tick-header::before {
    content: '▶'; font-size: 0.625rem; color: #22d3ee;
    transition: transform 0.15s; flex-shrink: 0;
  }
  details.tick-section[open] > .tick-header::before { transform: rotate(90deg); }
  .tick-label { font-size: 0.8125rem; font-weight: 600; color: #cffafe; }
  .tick-meta { font-size: 0.6875rem; color: #52525b; margin-left: auto; }
  .tick-badge {
    font-size: 0.625rem; padding: 0.0625rem 0.375rem; border-radius: 9999px;
    background: rgba(34,211,238,0.12); color: #22d3ee;
  }
  .tick-body { padding: 0.25rem 0 0.25rem 1.25rem; }

  .step-entry {
    padding: 0.375rem 0.5rem;
    margin: 0.25rem 0;
    border-left: 2px solid #2a2a3a;
    font-size: 0.8125rem;
  }
  .step-entry.action-think  { border-left-color: #6366f1; }
  .step-entry.action-tool   { border-left-color: #f59e0b; }
  .step-entry.action-stop   { border-left-color: #10b981; }

  .step-action-badge {
    display: inline-block; font-size: 0.625rem; font-weight: 700;
    padding: 0.0625rem 0.375rem; border-radius: 0.25rem;
    text-transform: uppercase; letter-spacing: 0.04em;
    margin-right: 0.375rem;
  }
  .step-action-badge.think { background: rgba(99,102,241,0.15); color: #818cf8; }
  .step-action-badge.tool  { background: rgba(245,158,11,0.15); color: #f59e0b; }
  .step-action-badge.stop  { background: rgba(16,185,129,0.15); color: #10b981; }

  .step-summary { color: #d4d4d8; }
  .step-detail {
    margin-top: 0.25rem; padding: 0.375rem 0.5rem;
    background: rgba(26,26,36,0.6); border-radius: 0.375rem;
    font-size: 0.75rem; color: #a1a1aa;
    font-family: 'JetBrains Mono', 'Fira Code', monospace;
    white-space: pre-wrap; word-break: break-word;
    max-height: 12rem; overflow-y: auto;
  }

  .tool-result-block {
    margin: 0.125rem 0 0.25rem 1rem;
    padding: 0.25rem 0.5rem;
    border-left: 2px solid #3f3f46;
    font-size: 0.75rem; color: #71717a;
  }

  .memory-flush-block {
    margin: 0.25rem 0; padding: 0.375rem 0.75rem;
    background: rgba(16,185,129,0.04);
    border: 1px solid rgba(16,185,129,0.1);
    border-radius: 0.375rem; font-size: 0.75rem;
  }
  .memory-flush-label { color: #10b981; font-weight: 600; font-size: 0.6875rem; text-transform: uppercase; }
  .memory-item { color: #a1a1aa; margin: 0.25rem 0; padding-left: 0.5rem; border-left: 2px solid rgba(16,185,129,0.2); }
  .memory-item-text { color: #d4d4d8; }
  .memory-item-meta { font-size: 0.625rem; color: #52525b; }

  /* Collapsible sub-sections */
  .tick-sub { margin: 0.25rem 0; border-radius: 0.375rem; }
  .tick-sub > summary {
    list-style: none; cursor: pointer; user-select: none;
    display: flex; align-items: center; gap: 0.375rem;
    padding: 0.25rem 0.375rem;
    font-size: 0.6875rem; font-weight: 600; text-transform: uppercase;
    letter-spacing: 0.03em; color: #71717a;
    border-radius: 0.375rem; transition: background 0.12s;
  }
  .tick-sub > summary:hover { background: rgba(255,255,255,0.03); }
  .tick-sub > summary::-webkit-details-marker { display: none; }
  .tick-sub > summary::before {
    content: '▶'; font-size: 0.5rem; color: #52525b;
    transition: transform 0.12s; flex-shrink: 0;
  }
  .tick-sub[open] > summary::before { transform: rotate(90deg); }
  .tick-sub > .tick-sub-body { padding: 0.125rem 0 0.125rem 0.75rem; }
  .tick-sub.sub-step > summary { color: #818cf8; }
  .tick-sub.sub-step > summary::before { color: #6366f1; }
  .tick-sub.sub-tool-result > summary { color: #a1a1aa; }
  .tick-sub.sub-tool-result > summary::before { color: #71717a; }
  .tick-sub.sub-memories > summary { color: #10b981; }
  .tick-sub.sub-memories > summary::before { color: #10b981; }
  .tick-sub.sub-flush > summary { color: #10b981; }
  .tick-sub.sub-flush > summary::before { color: #10b981; }

  /* ── Compose bar ── */
  .chat-compose {
    flex-shrink: 0; border-top: 1px solid rgba(42,42,58,0.6); padding: 0.75rem 0 0.5rem;
  }
  .compose-box {
    background: rgba(26,26,36,0.9); border: 1px solid #2a2a3a;
    border-radius: 0.75rem; overflow: visible;
    backdrop-filter: blur(8px);
  }
  .compose-textarea {
    width: 100%; background: transparent; border: none; outline: none;
    color: #e4e4e7; font-size: 0.9375rem;
    padding: 0.875rem 1rem 0.5rem; resize: none;
    min-height: 2.5rem; max-height: 8rem; line-height: 1.5;
  }
  .compose-textarea::placeholder { color: #52525b; }
  .compose-textarea-wrap { position: relative; width: 100%; }

  .attach-btn {
    display: inline-flex; align-items: center; justify-content: center;
    width: 2rem; height: 2rem; flex-shrink: 0;
    border-radius: 50%; border: 1px solid rgba(42,42,58,0.5);
    background: transparent; color: #71717a; font-size: 1.1rem;
    cursor: pointer; transition: background 0.15s, color 0.15s;
  }
  .attach-btn:hover { background: rgba(99,102,241,0.1); color: #e4e4e7; }
  .attach-row { display: flex; align-items: stretch; }
  .attach-preview {
    display: none; padding: 0.375rem 0.75rem; gap: 0.5rem; flex-wrap: wrap;
    border-top: 1px solid rgba(42,42,58,0.5);
  }
  .attach-preview.has-files { display: flex; }
  .attach-chip {
    display: inline-flex; align-items: center; gap: 0.375rem;
    background: rgba(99,102,241,0.08); border: 1px solid rgba(99,102,241,0.2);
    border-radius: 0.375rem; padding: 0.25rem 0.5rem;
    font-size: 0.75rem; color: #a5b4fc; max-width: 180px;
  }
  .attach-chip span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .attach-chip button {
    background: none; border: none; color: #71717a; cursor: pointer;
    font-size: 0.85rem; padding: 0; line-height: 1;
  }
  .attach-chip button:hover { color: #ef4444; }

  .compose-toolbar {
    display: flex; align-items: center; gap: 0.5rem;
    padding: 0.375rem 0.75rem; border-top: 1px solid rgba(42,42,58,0.5);
  }
  .tb { display: inline-flex; align-items: center; gap: 0.25rem;
    padding: 0.25rem 0.5rem; border-radius: 0.375rem; font-size: 0.75rem;
    color: #a1a1aa; background: transparent; border: 1px solid transparent;
    cursor: pointer; transition: background-color 0.15s, color 0.15s; white-space: nowrap; }
  .tb:hover { background: rgba(99,102,241,0.1); color: #e4e4e7; }
  .tb.on { background: rgba(99,102,241,0.15); color: #818cf8; border-color: rgba(99,102,241,0.2); }
  .tb-sel {
    background: transparent; border: 1px solid rgba(42,42,58,0.5);
    border-radius: 0.375rem; padding: 0.2rem 0.4rem; font-size: 0.75rem;
    color: #a1a1aa; outline: none; cursor: pointer;
  }
  .tb-sel:focus { border-color: #6366f1; }
  .tb-sel.local-conn { border-color: rgba(16,185,129,0.4); color: #6ee7b7; }
  .tb-sel.cloud-conn { border-color: rgba(99,102,241,0.4); color: #a5b4fc; }
  .tb-sel.auto-conn  { border-color: rgba(251,191,36,0.4); color: #fbbf24; }
  #chat-model { max-width: 11rem; }
  #chat-model option { background: #1a1a24; color: #d4d4d8; }
  #chat-model optgroup { color: #71717a; font-style: normal; font-size: 0.6875rem; }
  #chat-model optgroup.pinned-group { color: #fbbf24; }
  #chat-model optgroup.pinned-group option { color: #fde68a; }
  .pin-btn { background: none; border: none; cursor: pointer; font-size: 0.8rem; padding: 0 0.2rem; opacity: 0.5; transition: opacity 0.15s; }
  .pin-btn:hover { opacity: 1; }
  .pin-btn.is-pinned { opacity: 1; }
  .tb-num {
    background: transparent; border: 1px solid rgba(42,42,58,0.5);
    border-radius: 0.375rem; padding: 0.2rem 0.4rem; font-size: 0.75rem;
    color: #e4e4e7; outline: none; width: 2.5rem; text-align: center;
  }
  .tb-num:focus { border-color: #6366f1; }
  .tb-sep { width: 1px; height: 1.25rem; background: #2a2a3a; flex-shrink: 0; }

  .send-btn, .stop-btn {
    margin-left: auto; display: inline-flex; align-items: center; justify-content: center;
    width: 2.25rem; height: 2.25rem; border-radius: 50%; border: none;
    color: white; cursor: pointer; font-size: 1rem; transition: background 0.15s; flex-shrink: 0;
  }
  .send-btn { background: #6366f1; }
  .send-btn:hover { background: #818cf8; }
  .send-btn:disabled { opacity: 0.4; cursor: default; }
  .stop-btn { background: #ef4444; }
  .stop-btn:hover { background: #f87171; }

  /* TTS toggle */
  .tts-toggle { position: relative; }
  .tts-toggle.on-inworld { background: rgba(34,197,94,0.15); color: #22c55e; border-color: rgba(34,197,94,0.3); }
  .tts-toggle.on-inworld-hd { background: rgba(99,102,241,0.15); color: #818cf8; border-color: rgba(99,102,241,0.3); }
  .tts-toggle.on-eleven { background: rgba(245,158,11,0.15); color: #f59e0b; border-color: rgba(245,158,11,0.3); }
  .tts-toggle .tts-dot {
    width: 5px; height: 5px; border-radius: 50%; background: #52525b;
    display: inline-block; margin-right: 0.125rem;
  }
  .tts-toggle.on-inworld .tts-dot { background: #22c55e; box-shadow: 0 0 4px #22c55e; }
  .tts-toggle.on-inworld-hd .tts-dot { background: #818cf8; box-shadow: 0 0 4px #818cf8; }
  .tts-toggle.on-eleven .tts-dot { background: #f59e0b; box-shadow: 0 0 4px #f59e0b; }
  .tts-playing-icon { display: inline-flex; align-items: center; gap: 1px; height: 10px; margin-left: 0.25rem; }
  .tts-playing-icon span {
    width: 2px; background: #f59e0b; border-radius: 1px;
    animation: tts-bar 0.6s ease-in-out infinite;
  }
  .tts-playing-icon span:nth-child(1) { height: 4px; animation-delay: 0s; }
  .tts-playing-icon span:nth-child(2) { height: 8px; animation-delay: 0.15s; }
  .tts-playing-icon span:nth-child(3) { height: 6px; animation-delay: 0.3s; }
  @keyframes tts-bar { 0%,100% { transform: scaleY(0.5); } 50% { transform: scaleY(1.2); } }

  /* TTS volume slider popup */
  .tts-vol-wrap { position: relative; display: inline-block; vertical-align: middle; }
  .tts-vol-popup {
    position: absolute; bottom: calc(100% + 8px); left: 50%; transform: translateX(-50%);
    background: #1a1a24; border: 1px solid rgba(99,102,241,0.2); border-radius: 8px;
    padding: 8px 6px; display: none; z-index: 9999; min-height: 100px;
    box-shadow: 0 4px 16px rgba(0,0,0,0.5);
  }
  .tts-vol-popup.open { display: flex; flex-direction: column; align-items: center; gap: 4px; }
  .tts-vol-popup input[type=range] {
    writing-mode: vertical-lr; direction: rtl;
    width: 20px; height: 80px; cursor: pointer; accent-color: #6366f1;
  }
  .tts-vol-popup .vol-pct { font-size: 0.65rem; color: #a1a1aa; font-variant-numeric: tabular-nums; }
  .tts-vol-btn {
    background: none; border: none; cursor: pointer; font-size: 0.85rem;
    color: #71717a; padding: 0 2px; transition: color 0.15s;
  }
  .tts-vol-btn:hover { color: #e4e4e7; }

  /* Per-message speak button */
  .msg-speak-btn {
    background: none; border: none; cursor: pointer; font-size: 0.8rem;
    color: #52525b; padding: 0 0.25rem; opacity: 0; transition: opacity 0.15s;
    vertical-align: middle;
  }
  .chat-entry:hover .msg-speak-btn { opacity: 1; }
  .msg-speak-btn:hover { color: #e4e4e7; }
  .msg-speak-btn.playing { opacity: 1; color: #f59e0b; }
  .msg-speak-btn.playing::after { content: ' ■'; font-size: 0.6rem; }

  .msg-meta .meta-tts-cost { color: #f59e0b; font-weight: 600; }
  .msg-meta .meta-tts-cost.free { color: #22c55e; }
  .msg-meta .meta-total { color: #818cf8; font-weight: 600; }

  /* Mic (STT) button */
  .mic-btn {
    position: absolute; right: 0.5rem; bottom: 0.5rem;
    background: rgba(99,102,241,0.12); border: 1px solid rgba(99,102,241,0.2);
    border-radius: 0.375rem; color: #71717a; cursor: pointer;
    font-size: 1rem; padding: 0.25rem 0.4rem;
    transition: color 0.15s, background-color 0.15s; line-height: 1;
  }
  .mic-btn:hover { color: #e4e4e7; background: rgba(99,102,241,0.2); }
  .mic-btn.recording {
    color: #ef4444; background: rgba(239,68,68,0.12);
    border-color: rgba(239,68,68,0.3);
    animation: mic-pulse 1s ease-in-out infinite;
  }
  .mic-btn.transcribing {
    color: #f59e0b; background: rgba(245,158,11,0.12);
    border-color: rgba(245,158,11,0.3);
    animation: mic-pulse 1s ease-in-out infinite;
  }
  @keyframes mic-pulse { 0%,100% { box-shadow: 0 0 0 0 rgba(239,68,68,0.3); } 50% { box-shadow: 0 0 0 6px rgba(239,68,68,0); } }

  /* STT toggle button */
  .stt-toggle { position: relative; }
  .stt-toggle.on-elevenlabs { background: rgba(245,158,11,0.15); color: #f59e0b; border-color: rgba(245,158,11,0.3); }
  .stt-toggle .stt-dot {
    width: 5px; height: 5px; border-radius: 50%; background: #52525b;
    display: inline-block; margin-right: 0.125rem;
  }
  .stt-toggle.on-elevenlabs .stt-dot { background: #f59e0b; box-shadow: 0 0 4px #f59e0b; }

  .empty-state {
    display: flex; flex-direction: column; align-items: center;
    justify-content: center; height: 100%; color: #52525b; gap: 0.75rem;
  }
  .empty-state-icon { font-size: 2.5rem; opacity: 0.35; }

  .new-chat-btn {
    display: flex; align-items: center; gap: 0.5rem;
    padding: 0.5rem 0.75rem; border-radius: 0.5rem;
    background: rgba(99,102,241,0.12); border: 1px solid rgba(99,102,241,0.2);
    color: #818cf8; font-size: 0.8125rem; cursor: pointer;
    transition: background-color 0.15s; width: 100%;
  }
  .new-chat-btn:hover { background: rgba(99,102,241,0.2); }

  .folder-input {
    width: 100%; background: #1a1a24; border: 1px solid #2a2a3a;
    border-radius: 0.375rem; padding: 0.375rem 0.5rem; font-size: 0.8125rem;
    color: #e4e4e7; outline: none;
  }
  .folder-input:focus { border-color: #6366f1; }

  /* Context menu */
  .ctx-menu {
    position: fixed; background: #1a1a24; border: 1px solid #2a2a3a;
    border-radius: 0.5rem; padding: 0.25rem; z-index: 999;
    box-shadow: 0 8px 24px rgba(0,0,0,0.4); min-width: 160px;
  }
  .ctx-item {
    display: block; width: 100%; text-align: left; padding: 0.375rem 0.75rem;
    font-size: 0.8125rem; color: #d4d4d8; background: none; border: none;
    border-radius: 0.25rem; cursor: pointer;
  }
  .ctx-item:hover { background: rgba(99,102,241,0.1); }
  .ctx-item.danger { color: #fca5a5; }
  .ctx-item.danger:hover { background: rgba(239,68,68,0.1); }

  .sidebar-toggle {
    background: none; border: none; color: #71717a; cursor: pointer;
    font-size: 1.1rem; padding: 0.25rem; flex-shrink: 0;
  }
  .sidebar-toggle:hover { color: #e4e4e7; }

  .sidebar-expand-float {
    position: absolute; top: 0.625rem; left: 0.75rem; z-index: 10;
    background: rgba(26,26,36,0.85); border: 1px solid rgba(42,42,58,0.5);
    border-radius: 0.375rem; color: #71717a; cursor: pointer;
    font-size: 1.1rem; padding: 0.25rem 0.4rem; display: none;
    backdrop-filter: blur(4px);
  }
  .sidebar-expand-float:hover { color: #e4e4e7; background: rgba(26,26,36,0.95); }
  .chat-sidebar.collapsed ~ .chat-main .sidebar-expand-float { display: flex; }

  /* ── Prompt Inspector (kept from existing) ── */
  .layers-toggle {
    display:inline-flex; align-items:center; gap:0.25rem;
    background:none; border:1px solid rgba(99,102,241,0.2); border-radius:0.375rem;
    color:#6366f1; font-size:0.6875rem; font-weight:600;
    padding:0.125rem 0.5rem; cursor:pointer; margin-left:3.5rem; margin-top:0.25rem;
    transition:all 0.15s; opacity:0.7;
  }
  .layers-toggle:hover { opacity:1; background:rgba(99,102,241,0.08); }
  .layers-toggle.open { opacity:1; background:rgba(99,102,241,0.12); }
  .layers-panel {
    margin-left:3.5rem; margin-top:0.5rem;
    background:rgba(15,15,20,0.8); border:1px solid rgba(99,102,241,0.15);
    border-radius:0.625rem; padding:1rem; overflow:hidden;
    display:none; animation:layersFade 0.2s ease;
  }
  .layers-panel.open { display:block; }
  @keyframes layersFade { from{opacity:0;transform:translateY(-4px)} to{opacity:1;transform:none} }
  .layer-row {
    display:flex; align-items:flex-start; gap:0.75rem;
    padding:0.5rem 0; border-bottom:1px solid rgba(42,42,58,0.4);
  }
  .layer-row:last-child { border-bottom:none; }
  .layer-num {
    width:1.5rem; height:1.5rem; border-radius:50%; flex-shrink:0;
    display:flex; align-items:center; justify-content:center;
    font-size:0.625rem; font-weight:800; color:#fff;
  }
  .layer-num-1 { background:linear-gradient(135deg,#6366f1,#818cf8); }
  .layer-num-2 { background:linear-gradient(135deg,#8b5cf6,#a78bfa); }
  .layer-num-3 { background:linear-gradient(135deg,#10b981,#34d399); }
  .layer-num-4 { background:linear-gradient(135deg,#22d3ee,#67e8f9); }
  .layer-num-5 { background:linear-gradient(135deg,#71717a,#a1a1aa); }
  .layer-num-6 { background:linear-gradient(135deg,#f59e0b,#fbbf24); }
  .layer-info { flex:1; min-width:0; }
  .layer-label { font-size:0.75rem; font-weight:700; color:#e4e4e7; }
  .layer-stat { font-size:0.6875rem; color:#71717a; margin-left:0.5rem; font-weight:400; }
  .layer-preview {
    font-size:0.6875rem; color:#52525b; margin-top:0.25rem;
    line-height:1.45; white-space:pre-wrap; word-break:break-word;
    max-height:4rem; overflow:hidden;
    font-family:ui-monospace,SFMono-Regular,monospace;
  }
  .layer-bar {
    display:flex; height:4px; border-radius:2px; overflow:hidden; gap:1px;
    margin-top:0.5rem; margin-bottom:0.25rem; margin-left:3.5rem;
  }
  .layer-bar-seg { height:100%; border-radius:2px; transition:width 0.3s ease; min-width:2px; }
  .layer-bar-1 { background:#6366f1; }
  .layer-bar-2 { background:#8b5cf6; }
  .layer-bar-3 { background:#10b981; }
  .layer-bar-4 { background:#22d3ee; }
  .layer-bar-5 { background:#71717a; }
  .layer-bar-6 { background:#f59e0b; }

  /* Tool call badge */
  .tool-calls-badge {
    display:inline-flex; align-items:center; gap:0.25rem;
    background:rgba(245,158,11,0.1); border:1px solid rgba(245,158,11,0.25);
    border-radius:0.375rem; color:#fbbf24; font-size:0.6875rem; font-weight:600;
    padding:0.125rem 0.5rem; margin-left:0.375rem; cursor:pointer;
    transition:all 0.15s; opacity:0.8;
  }
  .tool-calls-badge:hover { opacity:1; }
  .tool-calls-panel {
    margin-left:3.5rem; margin-top:0.375rem;
    background:rgba(15,15,20,0.8); border:1px solid rgba(245,158,11,0.15);
    border-radius:0.625rem; padding:0.75rem 1rem; overflow:hidden;
    display:none; animation:layersFade 0.2s ease;
  }
  .tool-calls-panel.open { display:block; }
  .tool-call-entry { padding:0.375rem 0; border-bottom:1px solid rgba(42,42,58,0.4); font-size:0.75rem; }
  .tool-call-entry:last-child { border-bottom:none; }
  .tool-call-name { color:#fbbf24; font-weight:700; }
  .tool-call-round { color:#71717a; font-size:0.625rem; margin-left:0.375rem; }
  .tool-call-args { color:#52525b; font-family:ui-monospace,SFMono-Regular,monospace; font-size:0.6875rem; margin-top:0.125rem; }
  .tool-call-result { color:#3f3f46; font-family:ui-monospace,SFMono-Regular,monospace; font-size:0.6875rem; margin-top:0.125rem; white-space:pre-wrap; word-break:break-word; max-height:3rem; overflow:hidden; }

  /* ── Markdown-rendered message body ── */
  .msg-body h1, .msg-body h2, .msg-body h3, .msg-body h4 {
    margin: 0.5rem 0 0.25rem; font-weight: 700; color: #e4e4e7; line-height: 1.35;
  }
  .msg-body h1 { font-size: 1.25rem; }
  .msg-body h2 { font-size: 1.1rem; }
  .msg-body h3 { font-size: 1rem; }
  .msg-body h4 { font-size: 0.9375rem; color: #a1a1aa; }
  .msg-body p { margin: 0.25rem 0; }
  .msg-body ul { margin: 0.25rem 0 0.25rem 0.25rem; padding-left: 1.25rem; list-style-type: disc; }
  .msg-body ol { margin: 0.25rem 0 0.25rem 0.25rem; padding-left: 1.25rem; list-style-type: decimal; }
  .msg-body li { margin: 0.125rem 0; }
  .msg-body > *:first-child { margin-top: 0; }
  .msg-body > *:last-child { margin-bottom: 0; }
  .msg-body blockquote {
    border-left: 3px solid #6366f1; padding: 0.25rem 0.75rem; margin: 0.5rem 0;
    color: #a1a1aa; background: rgba(99,102,241,0.04); border-radius: 0 0.375rem 0.375rem 0;
  }
  .msg-body a { color: #818cf8; text-decoration: underline; text-underline-offset: 2px; }
  .msg-body a:hover { color: #a5b4fc; }
  .msg-body table { border-collapse: collapse; margin: 0.5rem 0; font-size: 0.8125rem; width: 100%; }
  .msg-body th, .msg-body td {
    border: 1px solid #2a2a3a; padding: 0.375rem 0.625rem; text-align: left;
  }
  .msg-body th { background: rgba(99,102,241,0.08); font-weight: 600; color: #e4e4e7; }
  .msg-body hr { border: none; border-top: 1px solid #2a2a3a; margin: 0.75rem 0; }
  .msg-body img {
    max-width: 100%; border-radius: 0.5rem; margin: 0.5rem 0;
    border: 1px solid rgba(42,42,58,0.5);
  }

  /* ── Code blocks (enhanced with copy button) ── */
  .code-block-wrap {
    position: relative; margin: 0.625rem 0; border-radius: 0.5rem; overflow: hidden;
    border: 1px solid rgba(99,102,241,0.2); background: rgba(15,15,25,0.35);
    backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
  }
  .code-block-header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 0.375rem 0.75rem; background: rgba(99,102,241,0.08);
    border-bottom: 1px solid rgba(99,102,241,0.15);
  }
  .code-block-lang {
    font-size: 0.6875rem; font-weight: 600; color: #71717a; text-transform: uppercase;
    letter-spacing: 0.04em;
  }
  .code-copy-btn {
    background: none; border: 1px solid rgba(63,63,70,0.4); border-radius: 0.25rem;
    color: #71717a; font-size: 0.6875rem; padding: 0.125rem 0.5rem; cursor: pointer;
    transition: background-color 0.15s, color 0.15s, border-color 0.15s; display: flex; align-items: center; gap: 0.25rem;
  }
  .code-copy-btn:hover { color: #e4e4e7; border-color: #6366f1; background: rgba(99,102,241,0.08); }
  .code-copy-btn.copied { color: #10b981; border-color: #10b981; }
  .code-block-wrap pre {
    margin: 0; padding: 0.75rem 1rem; overflow-x: auto; font-size: 0.8125rem;
    line-height: 1.6; background: transparent !important;
  }
  .code-block-wrap pre code {
    font-family: 'JetBrains Mono', 'Fira Code', ui-monospace, SFMono-Regular, monospace;
    font-size: 0.8125rem; background: transparent !important;
  }
  /* Inline code (not in a block) */
  .msg-body code:not(pre code) {
    background: rgba(99,102,241,0.1); padding: 0.125rem 0.375rem;
    border-radius: 0.25rem; font-size: 0.85em; color: #c4b5fd;
    font-family: 'JetBrains Mono', 'Fira Code', ui-monospace, monospace;
  }
  /* Override for old .assistant-code / .assistant-inline-code so marked output takes precedence */
  .msg-body .assistant-code, .msg-body .assistant-inline-code { all: unset; }

  /* ── Per-message action bar ── */
  .msg-actions {
    display: flex; align-items: center; gap: 0.125rem;
    margin-left: 3.5rem; margin-top: 0.25rem;
    opacity: 0; transition: opacity 0.15s;
  }
  .chat-entry:hover .msg-actions { opacity: 1; }
  .msg-actions.always-visible { opacity: 1; }
  .msg-action-btn {
    background: none; border: 1px solid transparent; border-radius: 0.375rem;
    color: #52525b; font-size: 0.75rem; padding: 0.2rem 0.5rem;
    cursor: pointer; transition: background-color 0.15s, color 0.15s, border-color 0.15s; display: inline-flex;
    align-items: center; gap: 0.25rem; white-space: nowrap;
  }
  .msg-action-btn:hover { color: #e4e4e7; background: rgba(99,102,241,0.08); border-color: rgba(99,102,241,0.15); }
  .msg-action-btn.active { color: #6366f1; }
  .msg-action-btn.copied { color: #10b981; }

  /* ── Suggested responses ── */
  .suggestions-bar {
    display: flex; flex-wrap: wrap; gap: 0.5rem; padding: 0.5rem 0;
    justify-content: center;
  }
  .suggestion-chip {
    background: rgba(99,102,241,0.06); border: 1px solid rgba(99,102,241,0.18);
    border-radius: 1.5rem; padding: 0.375rem 0.875rem;
    font-size: 0.8125rem; color: #a5b4fc; cursor: pointer;
    transition: background-color 0.15s, border-color 0.15s, color 0.15s; white-space: nowrap; max-width: 280px;
    overflow: hidden; text-overflow: ellipsis;
  }
  .suggestion-chip:hover {
    background: rgba(99,102,241,0.15); border-color: rgba(99,102,241,0.35);
    color: #c7d2fe; transform: translateY(-1px);
  }

  /* Mobile toolbar menu */
  .tb-mobile-toggle {
    display: none; align-items: center; justify-content: center;
    width: 2rem; height: 2rem; border-radius: 50%; border: 1px solid rgba(42,42,58,0.5);
    background: transparent; color: #a1a1aa; font-size: 1.1rem;
    cursor: pointer; transition: background 0.15s, color 0.15s; flex-shrink: 0;
  }
  .tb-mobile-toggle:hover { background: rgba(99,102,241,0.1); color: #e4e4e7; }
  .tb-mobile-toggle.open { background: rgba(99,102,241,0.15); color: #818cf8; border-color: rgba(99,102,241,0.2); }
  .tb-collapsible { display: contents; }

  @media (max-width: 640px) {
    .tb-mobile-toggle { display: inline-flex; }
    .tb-collapsible {
      display: none;
      position: absolute; bottom: 100%; left: 0; right: 0;
      background: #18181b; border: 1px solid rgba(42,42,58,0.7);
      border-radius: 0.5rem 0.5rem 0 0;
      padding: 0.5rem 0.75rem;
      flex-wrap: wrap; gap: 0.5rem; align-items: center;
      box-shadow: 0 -4px 16px rgba(0,0,0,0.4);
      z-index: 20;
    }
    .tb-collapsible.open { display: flex; }
    .tb-collapsible .tb-sep { display: none; }
    .compose-toolbar { position: relative; }
  }
</style>

<!-- ═══════════════ LAYOUT ═══════════════ -->
<div class="chat-layout">

  <!-- ═══ SIDEBAR ═══ -->
  <div class="chat-sidebar" id="sidebar">
    <div class="sidebar-header">
      <button class="new-chat-btn" onclick="newChat()">
        <span>+</span> New Chat
      </button>
      <button class="sidebar-toggle" onclick="toggleSidebar()" title="Toggle sidebar">☰</button>
    </div>
    <div class="sidebar-scroll" id="sidebar-list"></div>
  </div>

  <!-- ═══ MAIN CHAT ═══ -->
  <div class="chat-main">
    <button class="sidebar-expand-float" onclick="toggleSidebar()" title="Show sidebar">☰</button>
    {% if chat_background %}
    <div class="chat-bg-overlay" style="background-image: url('{{ chat_background }}');"></div>
    {% endif %}
    <div class="chat-container">
      <div class="chat-topbar">
        <div class="flex items-center gap-3">
          <h1 id="chat-title" class="text-lg font-bold text-white">Agent Chat</h1>
          <span id="session-status" class="badge badge-scope text-xs">idle</span>
        </div>
        <div style="display:flex; align-items:center; gap:0.5rem; margin-left:auto;">
          <div id="credit-balance" style="display:none; font-size:0.75rem; color:#a78bfa; font-family:ui-monospace,SFMono-Regular,monospace; padding:0.25rem 0.75rem; background:rgba(99,102,241,0.08); border:1px solid rgba(99,102,241,0.2); border-radius:0.375rem; cursor:pointer;" onclick="window.location='/store'" title="Click to buy more credits">
            <span id="credit-bal-text">0 credits</span>
          </div>
          <div id="cost-ticker" style="display:none; font-size:0.75rem; color:#71717a; font-family:ui-monospace,SFMono-Regular,monospace; padding:0.25rem 0.75rem; background:rgba(19,19,26,0.6); border:1px solid #2a2a3a; border-radius:0.375rem;"></div>
        </div>
      </div>

      <div class="chat-thread" id="chat-thread">
        <div class="empty-state" id="empty-state">
          <span class="empty-state-icon">⟡</span>
          <span class="text-sm">Send a message to start a session</span>
          <span class="text-xs text-zinc-600">Select an agent and mode from the toolbar below</span>
        </div>
      </div>

      <!-- Suggestion chips -->
      <div class="suggestions-bar" id="suggestion-chips" style="display:none;"></div>

      <!-- Compose bar -->
      <div class="chat-compose">
        <div class="compose-box">
          <div class="attach-row">
            <div class="compose-textarea-wrap">
            <textarea id="chat-stimulus" class="compose-textarea" rows="1"
                      placeholder="Send a message…"
                      onkeydown="handleKey(event)"
                      oninput="autoResize(this)"></textarea>
            <button type="button" onclick="toggleMic()" id="btn-mic" class="mic-btn" title="Voice input (ElevenLabs Speech-to-Text)">🎙️</button>
            </div>
          </div>
          <div class="attach-preview" id="attach-preview"></div>
          <div class="compose-toolbar">
            <button type="button" class="attach-btn" onclick="document.getElementById('attach-input').click()" title="Attach image or file">📎</button>
            <input type="file" id="attach-input" multiple accept="image/*,.pdf,.txt,.md,.csv,.json,.yaml,.yml" style="display:none" onchange="handleAttach(this)">
            <button type="button" class="tb-mobile-toggle" id="btn-tb-menu" onclick="toggleToolbarMenu()" title="Options">+</button>
            <div class="tb-collapsible" id="tb-collapsible">
              <!-- STT provider toggle hidden; ElevenLabs is the sole provider -->
              <button type="button" onclick="toggleSTTProvider()" id="btn-stt" class="tb stt-toggle on-elevenlabs" title="STT: ElevenLabs" style="display:none">
                <span class="stt-dot"></span><span id="stt-label">🎤 ElevenLabs</span>
              </button>
              <div class="tb-sep"></div>
              <select id="chat-agent" class="tb-sel" title="Agent">
                <option value="__none__">🧠 LLM Only</option>
                {% for agent in agents %}
                <option value="{{ agent }}">{{ agent | capitalize }}</option>
                {% endfor %}
              </select>
              <div class="tb-sep"></div>
              <select id="chat-connection" class="tb-sel" title="API Connection" onchange="onConnectionChange(this)">
                <option value="__platform__" data-type="platform" data-provider="openrouter" data-url="" data-models="">🧩 Platform Models</option>
                <option value="__auto__" data-type="auto" data-provider="router" data-url="" data-models="">🤖 Auto (User Router)</option>
                <option value="__user__" data-type="user" data-provider="user" data-url="" data-models="">👤 User Models</option>
              </select>
              <select id="chat-model" class="tb-sel" title="Model" style="display:none;">
                <option value="">Loading…</option>
              </select>
              <button type="button" id="btn-pin-model" class="pin-btn" title="Pin/unpin current model as favorite" onclick="togglePinModel()" style="display:none;">📌</button>
              <div class="tb-sep"></div>
              <button type="button" onclick="toggleTTS()" id="btn-tts" class="tb tts-toggle" title="Text-to-Speech — click to cycle">
                <span class="tts-dot"></span><span id="tts-label">🔊 TTS</span>
              </button>
              <div class="tts-vol-wrap">
                <button type="button" class="tts-vol-btn" onclick="toggleVolPopup()" id="btn-vol" title="TTS Volume">🔉</button>
                <div class="tts-vol-popup" id="vol-popup">
                  <span class="vol-pct" id="vol-pct">80%</span>
                  <input type="range" id="vol-slider" min="0" max="100" value="80" oninput="setTtsVolume(this.value)">
                </div>
              </div>
              <button type="button" onclick="stopTtsGlobal()" id="btn-tts-stop" class="tb" style="display:none; color:#ef4444; font-size:0.75rem;" title="Stop TTS playback">⏹</button>
            </div>
            <button onclick="runChat()" id="btn-send" class="send-btn" title="Send (Ctrl+Enter)">▶</button>
            <button onclick="stopChat()" id="btn-stop" class="stop-btn" style="display:none;" title="Stop">■</button>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Context menu (hidden) -->
<div id="ctx-menu" class="ctx-menu" style="display:none;"></div>

<script>
// ═══════════════════════════════════════════
//  STATE
// ═══════════════════════════════════════════
let _mode = 'chat';
let _chatId = null;
let _sessionId = null;
let _poll = null;
let _msgs = [];
const _openFolders = new Set();
let _ttsProvider = 'off';     // 'off' | 'inworld' | 'inworld-hd' | 'eleven'
let _ttsAudio = null;
let _ttsVolume = 0.8;
const _ttsCache = new Map();
const _TTS_CACHE_MAX = 10;
let _sttRecognition = null;
let _sttProvider = {{ stt_provider | tojson | default("'elevenlabs'") }};
let _mediaRecorder = null;
let _audioChunks = [];
let _sttStream = null;
let _sttSilenceTimer = null;
let _attachedFiles = [];
let _sttAnalyser = null;
let _index = {{ chat_index | tojson }};
const _agentConns = {{ agent_connections | tojson }};
const _userProfile = {{ user_profile | tojson }};
const _avatarMap = {{ avatar_map | tojson }};
let _pricing = {};  // lazy-loaded from /api/pricing
const _platformConnections = {{ platform_connections | tojson }};
let _pinnedModels = {{ pinned_models | tojson }};
const _chatDefaults = {{ chat_defaults | tojson }};
let _lastPlatformData = null;
let _pendingModelRestore = null;
let _sessionCost = 0;
let _sessionTokens = 0;
let _sessionCredits = 0;
let _sessionTtsCost = 0;
let _sessionSttCost = 0;
let _creditBalance = -1;  // -1 = unknown

// ═══════════════════════════════════════════
//  INIT
// ═══════════════════════════════════════════
function _saveChatDefaults() {
  const agent = document.getElementById('chat-agent').value;
  const connection = document.getElementById('chat-connection').value;
  const model = document.getElementById('chat-model').value;
  fetch('/api/settings/chat-defaults', {
    method: 'PUT',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ last_agent: agent, last_connection: connection, last_model: model }),
  }).catch(() => {});
}

(function init() {
  renderSidebar();

  // Restore saved agent
  if (_chatDefaults.last_agent) {
    const agentSel = document.getElementById('chat-agent');
    const opts = Array.from(agentSel.options).map(o => o.value);
    if (opts.includes(_chatDefaults.last_agent)) {
      agentSel.value = _chatDefaults.last_agent;
    }
  }

  // Restore saved connection
  if (_chatDefaults.last_connection) {
    const connSel = document.getElementById('chat-connection');
    const opts = Array.from(connSel.options).map(o => o.value);
    if (opts.includes(_chatDefaults.last_connection)) {
      connSel.value = _chatDefaults.last_connection;
    }
  }

  // Queue model restore after async model fetch completes
  if (_chatDefaults.last_model) {
    _pendingModelRestore = _chatDefaults.last_model;
  }

  document.getElementById('chat-agent').addEventListener('change', function() {
    document.getElementById('chat-connection').value = _agentConns[this.value] || '__platform__';
    onConnectionChange(document.getElementById('chat-connection'));
    _saveChatDefaults();
  });
  document.getElementById('chat-connection').addEventListener('change', function() {
    _saveChatDefaults();
  });
  document.getElementById('chat-model').addEventListener('change', function() {
    _saveChatDefaults();
  });

  backfillEmojis();
  fetch('/api/pricing').then(r => r.json()).then(d => { _pricing = d; }).catch(() => {});
  if (!document.getElementById('chat-connection').value) {
    document.getElementById('chat-connection').value = '__platform__';
  }
  onConnectionChange(document.getElementById('chat-connection'));
  fetchCreditBalance();
  document.getElementById('chat-model').addEventListener('change', _updatePinButtonState);
})();

async function backfillEmojis() {
  const chats = (_index.chats || []).filter(c => c.title && c.title !== 'New Chat' && !c.emoji);
  for (const c of chats.slice(0, 10)) {
    try {
      const resp = await fetch(`/api/chats/${c.id}/emoji`, {method: 'POST'});
      const data = await resp.json();
      if (data.emoji) { c.emoji = data.emoji; renderSidebar(); }
    } catch (e) { /* skip */ }
  }
}

function updateCostTicker() {
  const el = document.getElementById('cost-ticker');
  if (!el) return;
  const costStr = _sessionCost > 0.01 ? '$' + _sessionCost.toFixed(4) : '$' + _sessionCost.toFixed(6);
  let html = `<span style="opacity:0.5;">Session:</span> ${costStr} <span style="opacity:0.4;">·</span> ${_sessionTokens.toLocaleString()} tok`;
  if (_sessionTtsCost > 0) {
    const ttsStr = _sessionTtsCost > 0.01 ? '$' + _sessionTtsCost.toFixed(4) : '$' + _sessionTtsCost.toFixed(6);
    html += ` <span style="opacity:0.4;">·</span> <span style="color:#f59e0b;">TTS ${ttsStr}</span>`;
  }
  if (_sessionSttCost > 0) {
    const sttStr = _sessionSttCost > 0.01 ? '$' + _sessionSttCost.toFixed(4) : '$' + _sessionSttCost.toFixed(6);
    html += ` <span style="opacity:0.4;">·</span> <span style="color:#38bdf8;">STT ${sttStr}</span>`;
  }
  if (_sessionCredits > 0) {
    html += ` <span style="opacity:0.4;">·</span> <span style="color:#a78bfa;">${_sessionCredits} credits</span>`;
  }
  el.innerHTML = html;
  el.style.display = '';
}

function updateCreditBalance(balance) {
  if (balance === undefined || balance === null || balance < 0) return;
  _creditBalance = balance;
  const el = document.getElementById('credit-balance');
  const txt = document.getElementById('credit-bal-text');
  if (!el || !txt) return;
  txt.textContent = balance.toLocaleString() + ' credits';
  el.style.display = '';
  // Color by balance level
  if (balance <= 0) {
    el.style.borderColor = 'rgba(239,68,68,0.4)';
    el.style.color = '#ef4444';
    el.style.background = 'rgba(239,68,68,0.08)';
  } else if (balance < 100) {
    el.style.borderColor = 'rgba(245,158,11,0.4)';
    el.style.color = '#f59e0b';
    el.style.background = 'rgba(245,158,11,0.08)';
  } else {
    el.style.borderColor = 'rgba(99,102,241,0.2)';
    el.style.color = '#a78bfa';
    el.style.background = 'rgba(99,102,241,0.08)';
  }
}

async function fetchCreditBalance() {
  try {
    const resp = await fetch('/api/credits/balance');
    if (resp.ok) {
      const data = await resp.json();
      updateCreditBalance(data.credits);
    }
  } catch (e) { /* guest user or offline */ }
}

// ═══════════════════════════════════════════
//  CONNECTION / MODEL HELPERS
// ═══════════════════════════════════════════
let _ollamaModels = null;

function _tryRestoreModel() {
  if (!_pendingModelRestore) return;
  const modelSel = document.getElementById('chat-model');
  const opts = Array.from(modelSel.options).map(o => o.value);
  if (opts.includes(_pendingModelRestore)) {
    modelSel.value = _pendingModelRestore;
    _updatePinButtonState();
  }
  _pendingModelRestore = null;
}

function onConnectionChange(sel) {
  const opt = sel.selectedOptions[0];
  const connType = opt?.dataset?.type || 'external';
  const provider = opt?.dataset?.provider || '';
  const connUrl = opt?.dataset?.url || '';
  const modelSel = document.getElementById('chat-model');
  const connSel = document.getElementById('chat-connection');
  const pinBtn = document.getElementById('btn-pin-model');

  connSel.classList.remove('local-conn', 'cloud-conn', 'auto-conn');
  if (sel.value === '__platform__') {
    connSel.classList.add('cloud-conn');
    modelSel.style.display = '';
    modelSel.innerHTML = '<option value="">Loading OpenRouter models…</option>';
    if (pinBtn) pinBtn.style.display = '';
    fetchPlatformModels();
    return;
  }
  if (pinBtn) pinBtn.style.display = 'none';
  if (sel.value === '__auto__') {
    connSel.classList.add('auto-conn');
    modelSel.style.display = 'none';
    return;
  }
  if (sel.value === '__user__') {
    connSel.classList.add('cloud-conn');
    modelSel.style.display = '';
    modelSel.innerHTML = '<option value="">Loading user models…</option>';
    fetchUserModels();
    return;
  }
  if (sel.value) {
    connSel.classList.add(connType === 'local' ? 'local-conn' : 'cloud-conn');
  }

  if (connType === 'local' || provider === 'ollama') {
    modelSel.style.display = '';
    modelSel.innerHTML = '<option value="">Loading models…</option>';
    fetchOllamaModels(connUrl || 'http://orionforge-engine-ollama.flycast:11434');
  } else if (sel.value && connType === 'external') {
    fetchCloudModels(sel.value);
  } else {
    modelSel.style.display = 'none';
  }
}

function _makeModelOption(connId, m) {
  const o = document.createElement('option');
  o.value = `${connId}::${typeof m === 'string' ? m : m.model}`;
  let label = typeof m === 'string' ? m : m.model;
  if (m.est_credits_per_1k_tok > 0) {
    label += ` (~${m.est_credits_per_1k_tok} cr/1k tok)`;
  }
  o.textContent = label;
  return o;
}

function _renderPlatformDropdown(data) {
  const modelSel = document.getElementById('chat-model');
  const pinBtn = document.getElementById('btn-pin-model');
  _lastPlatformData = data;
  updateCreditBalance(data.credits_balance);
  modelSel.innerHTML = '';
  const defOpt = document.createElement('option');
  defOpt.value = '';
  defOpt.textContent = 'Select OpenRouter model…';
  modelSel.appendChild(defOpt);

  // Build a lookup: value → {connId, m}
  const allModels = new Map();
  (data.providers || []).forEach(prov => {
    (prov.models || []).forEach(m => {
      allModels.set(`${prov.connection_id}::${m.model}`, { connId: prov.connection_id, m, provName: prov.name });
    });
  });

  // ⭐ Pinned favorites group
  if (_pinnedModels.length) {
    const favGroup = document.createElement('optgroup');
    favGroup.label = '⭐ Favorites';
    favGroup.className = 'pinned-group';
    let favAdded = 0;
    _pinnedModels.forEach(val => {
      const entry = allModels.get(val);
      if (entry) {
        favGroup.appendChild(_makeModelOption(entry.connId, entry.m));
        favAdded++;
      }
    });
    if (favAdded) modelSel.appendChild(favGroup);
  }

  // All models by provider
  let added = 0;
  (data.providers || []).forEach(prov => {
    if (!prov.models || !prov.models.length) return;
    const group = document.createElement('optgroup');
    group.label = `🧩 ${prov.name}`;
    prov.models.forEach(m => {
      group.appendChild(_makeModelOption(prov.connection_id, m));
      added++;
    });
    modelSel.appendChild(group);
  });

  if (pinBtn) pinBtn.style.display = '';
  _updatePinButtonState();
  _tryRestoreModel();
  return added;
}

function _updatePinButtonState() {
  const pinBtn = document.getElementById('btn-pin-model');
  const modelSel = document.getElementById('chat-model');
  if (!pinBtn) return;
  const val = modelSel.value;
  if (val && _pinnedModels.includes(val)) {
    pinBtn.classList.add('is-pinned');
    pinBtn.title = 'Unpin this model';
  } else {
    pinBtn.classList.remove('is-pinned');
    pinBtn.title = 'Pin this model as favorite';
  }
}

async function togglePinModel() {
  const modelSel = document.getElementById('chat-model');
  const val = modelSel.value;
  if (!val) return;
  const idx = _pinnedModels.indexOf(val);
  if (idx >= 0) {
    _pinnedModels.splice(idx, 1);
  } else {
    _pinnedModels.push(val);
  }
  // Persist
  try {
    await fetch('/api/settings/pinned-models', {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ pinned_models: _pinnedModels }),
    });
  } catch (e) { /* best-effort */ }
  // Re-render dropdown keeping selection
  if (_lastPlatformData) {
    _renderPlatformDropdown(_lastPlatformData);
    modelSel.value = val;
  }
  _updatePinButtonState();
}

async function fetchPlatformModels() {
  const modelSel = document.getElementById('chat-model');
  const platformIds = new Set(_platformConnections.map(c => c.id));
  if (!platformIds.size) {
    modelSel.innerHTML = '<option value="">OpenRouter not configured</option>';
    return;
  }
  try {
    const resp = await fetch('/api/platform/models');
    if (resp.ok) {
      const data = await resp.json();
      const added = _renderPlatformDropdown(data);
      if (!added) await _fetchPlatformModelsFallback();
      return;
    }
    await _fetchPlatformModelsFallback();
  } catch (e) {
    await _fetchPlatformModelsFallback();
  }
}

async function _fetchPlatformModelsFallback() {
  const modelSel = document.getElementById('chat-model');
  try {
    const resp = await fetch('/api/connections/all-models');
    const allMap = await resp.json();
    modelSel.innerHTML = '';
    const defOpt = document.createElement('option');
    defOpt.value = '';
    defOpt.textContent = 'Select OpenRouter model…';
    modelSel.appendChild(defOpt);

    let added = 0;
    _platformConnections.forEach(conn => {
      const models = (allMap[conn.id] || conn.models || []);
      if (!models.length) return;
      const group = document.createElement('optgroup');
      group.label = `🧩 ${conn.name}`;
      models.forEach(name => {
        const o = document.createElement('option');
        o.value = `${conn.id}::${name}`;
        o.textContent = name;
        group.appendChild(o);
        added += 1;
      });
      modelSel.appendChild(group);
    });

    if (!added) {
      modelSel.innerHTML = '<option value="">No OpenRouter models available</option>';
    }
    _tryRestoreModel();
  } catch (e) {
    modelSel.innerHTML = '<option value="">⚠ OpenRouter models unavailable</option>';
  }
}

async function fetchUserModels() {
  const modelSel = document.getElementById('chat-model');
  try {
    const resp = await fetch('/api/user/models');
    const data = await resp.json();
    modelSel.innerHTML = '';
    const defOpt = document.createElement('option');
    defOpt.value = '';
    defOpt.textContent = 'Select model…';
    modelSel.appendChild(defOpt);

    let added = 0;
    (data.providers || []).forEach(prov => {
      if (!prov.models || !prov.models.length) return;
      const group = document.createElement('optgroup');
      group.label = `👤 ${prov.name}`;
      prov.models.forEach(m => {
        const o = document.createElement('option');
        o.value = `__userkey_${prov.provider}::${m}`;
        o.textContent = m;
        group.appendChild(o);
        added += 1;
      });
      modelSel.appendChild(group);
    });

    if (!added) {
      modelSel.innerHTML = '<option value="">No API keys configured — add them in Settings</option>';
    }
    _tryRestoreModel();
  } catch (e) {
    modelSel.innerHTML = '<option value="">⚠ Failed to load user models</option>';
  }
}

function _buildChatRoutingPayload() {
  const connSel = document.getElementById('chat-connection');
  const modelSel = document.getElementById('chat-model');
  const selectedConn = connSel.value || null;
  const selectedModel = modelSel.value || null;

  if (selectedConn === '__auto__') {
    return { connection_id: null, model_override: null };
  }
  if (selectedConn === '__platform__') {
    if (selectedModel && selectedModel.includes('::')) {
      const parts = selectedModel.split('::');
      return { connection_id: parts[0], model_override: parts.slice(1).join('::') || null };
    }
    return { connection_id: null, model_override: null };
  }
  if (selectedConn === '__user__') {
    if (selectedModel && selectedModel.includes('::')) {
      const parts = selectedModel.split('::');
      return { connection_id: parts[0], model_override: parts.slice(1).join('::') || null };
    }
    return { connection_id: null, model_override: null };
  }
  return {
    connection_id: selectedConn,
    model_override: selectedModel,
  };
}

async function fetchOllamaModels(url) {
  const modelSel = document.getElementById('chat-model');
  try {
    const resp = await fetch(`/api/ollama/models?url=${encodeURIComponent(url)}`);
    const data = await resp.json();
    if (data.models && data.models.length > 0) {
      _ollamaModels = data.models;
      modelSel.innerHTML = '';
      const defOpt = document.createElement('option');
      defOpt.value = ''; defOpt.textContent = 'Select model…';
      modelSel.appendChild(defOpt);
      const group = document.createElement('optgroup');
      group.label = '🟢 LOCAL MODELS';
      data.models.forEach(m => {
        const o = document.createElement('option');
        o.value = m.name;
        let label = m.name;
        if (m.parameter_size) label += ` · ${m.parameter_size}`;
        if (m.size && m.size !== 'unknown') label += ` · ${m.size}`;
        if (m.quantization) label += ` (${m.quantization})`;
        o.textContent = label;
        group.appendChild(o);
      });
      modelSel.appendChild(group);
      modelSel.style.display = '';
      _tryRestoreModel();
    } else {
      modelSel.innerHTML = '<option value="">No models found</option>';
      if (data.error) modelSel.innerHTML = `<option value="">⚠ Ollama offline</option>`;
    }
  } catch (e) {
    modelSel.innerHTML = '<option value="">⚠ Connection failed</option>';
  }
}

async function fetchCloudModels(connId) {
  const modelSel = document.getElementById('chat-model');
  try {
    const resp = await fetch(`/api/connections/${connId}/models`);
    const data = await resp.json();
    if (data.models && data.models.length > 0) {
      modelSel.innerHTML = '';
      const defOpt = document.createElement('option');
      defOpt.value = ''; defOpt.textContent = 'Default model';
      modelSel.appendChild(defOpt);
      const group = document.createElement('optgroup');
      group.label = '☁ CLOUD MODELS';
      data.models.forEach(name => {
        const o = document.createElement('option');
        o.value = name; o.textContent = name;
        group.appendChild(o);
      });
      modelSel.appendChild(group);
      modelSel.style.display = '';
      _tryRestoreModel();
    } else {
      modelSel.style.display = 'none';
    }
  } catch (e) {
    modelSel.style.display = 'none';
  }
}

// ═══════════════════════════════════════════
//  INPUT HELPERS
// ═══════════════════════════════════════════
function handleKey(e) {
  if (e.key === 'Enter' && !e.shiftKey) {
    if (_mode === 'chat' || e.ctrlKey || e.metaKey) { e.preventDefault(); runChat(); }
  }
}
function autoResize(el) {
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight, 128) + 'px';
}
function setMode(mode) {
  _mode = 'chat';
}
function toggleSidebar() {
  document.getElementById('sidebar').classList.toggle('collapsed');
}
function toggleToolbarMenu() {
  document.getElementById('tb-collapsible').classList.toggle('open');
  document.getElementById('btn-tb-menu').classList.toggle('open');
}
function handleAttach(input) {
  for (const f of input.files) _attachedFiles.push(f);
  input.value = '';
  renderAttachPreview();
}
function removeAttach(idx) {
  _attachedFiles.splice(idx, 1);
  renderAttachPreview();
}
function renderAttachPreview() {
  const el = document.getElementById('attach-preview');
  if (!_attachedFiles.length) { el.className = 'attach-preview'; el.innerHTML = ''; return; }
  el.className = 'attach-preview has-files';
  el.innerHTML = _attachedFiles.map((f, i) => {
    const icon = f.type.startsWith('image/') ? '🖼️' : '📄';
    return `<div class="attach-chip">${icon}<span>${f.name}</span><button onclick="removeAttach(${i})">&times;</button></div>`;
  }).join('');
}

// ═══════════════════════════════════════════
//  TTS
// ═══════════════════════════════════════════
let _audioUnlocked = false;

function toggleVolPopup() {
  document.getElementById('vol-popup').classList.toggle('open');
}
function setTtsVolume(val) {
  _ttsVolume = parseInt(val) / 100;
  document.getElementById('vol-pct').textContent = val + '%';
  if (_ttsAudio) _ttsAudio.volume = _ttsVolume;
}
function stopTtsGlobal() {
  if (_ttsAudio) { _ttsAudio.pause(); _ttsAudio.currentTime = 0; _ttsAudio = null; }
  document.getElementById('btn-tts-stop').style.display = 'none';
  document.querySelectorAll('.msg-speak-btn.playing').forEach(b => b.classList.remove('playing'));
}
document.addEventListener('click', (e) => {
  const wrap = document.querySelector('.tts-vol-wrap');
  if (wrap && !wrap.contains(e.target)) {
    document.getElementById('vol-popup').classList.remove('open');
  }
});

function _ttsCacheKey(text) {
  let h = 0;
  for (let i = 0; i < text.length; i++) { h = ((h << 5) - h + text.charCodeAt(i)) | 0; }
  return h.toString(36);
}
function _ttsCacheGet(text) { return _ttsCache.get(_ttsCacheKey(text)) || null; }
function _ttsCacheSet(text, blobUrl, provider, charCount) {
  while (_ttsCache.size >= _TTS_CACHE_MAX) {
    const oldest = _ttsCache.keys().next().value;
    const entry = _ttsCache.get(oldest);
    if (entry && entry.blobUrl) URL.revokeObjectURL(entry.blobUrl);
    _ttsCache.delete(oldest);
  }
  _ttsCache.set(_ttsCacheKey(text), { blobUrl, provider, charCount, timestamp: Date.now() });
}

function _unlockAudio() {
  if (_audioUnlocked) return;
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const buf = ctx.createBuffer(1, 1, 22050);
    const src = ctx.createBufferSource();
    src.buffer = buf; src.connect(ctx.destination); src.start(0);
    _audioUnlocked = true;
  } catch (e) {}
}

function toggleTTS() {
  const cycle = { off: 'inworld', inworld: 'inworld-hd', 'inworld-hd': 'eleven', eleven: 'off' };
  _ttsProvider = cycle[_ttsProvider] || 'off';
  const btn = document.getElementById('btn-tts');
  const label = document.getElementById('tts-label');
  btn.className = 'tb tts-toggle';
  if (_ttsProvider === 'inworld') {
    _unlockAudio(); btn.classList.add('on-inworld'); label.textContent = '🔊 Inworld';
  } else if (_ttsProvider === 'inworld-hd') {
    _unlockAudio(); btn.classList.add('on-inworld-hd'); label.textContent = '🔊 Inworld HD';
  } else if (_ttsProvider === 'eleven') {
    _unlockAudio(); btn.classList.add('on-eleven'); label.textContent = '🔊 11Labs';
  } else {
    label.textContent = '🔊 TTS';
  }
  if (_ttsProvider === 'off') stopTtsGlobal();
}

const TTS_COST_PER_CHAR = 0.0003;
const TTS_PREMIUM_SURCHARGE_PER_CHAR = 0.0002;
const TTS_INWORLD_COST_PER_CHAR = 0.000005;  // $5/1M chars (Mini)
const TTS_INWORLD_HD_COST_PER_CHAR = 0.00001; // $10/1M chars (Max)
function _estimateTtsCost(charCount, provider, isPremium) {
  if (provider === 'inworld') return charCount * TTS_INWORLD_COST_PER_CHAR;
  if (provider === 'inworld-hd') return charCount * TTS_INWORLD_HD_COST_PER_CHAR;
  let cost = charCount * TTS_COST_PER_CHAR;
  if (isPremium) cost += charCount * TTS_PREMIUM_SURCHARGE_PER_CHAR;
  return cost * 2; // 2x markup for ElevenLabs TTS
}

function _showVoiceToast(msg) {

async function speakText(text, metaEl) {
  if (!text || _ttsProvider === 'off') return null;
  stopTtsGlobal();
  const agent = document.getElementById('chat-agent').value;
  const provider = _ttsProvider;

  let playingIcon = null;
  if (metaEl) {
    playingIcon = document.createElement('span');
    playingIcon.className = 'tts-playing-icon';
    playingIcon.innerHTML = '<span></span><span></span><span></span>';
    metaEl.appendChild(playingIcon);
  }
  document.getElementById('btn-tts-stop').style.display = '';

  const cached = _ttsCacheGet(text);
  if (cached) {
    _playAudioBlob(cached.blobUrl, playingIcon, false);
    return { characters: cached.charCount, cost: 0, provider: cached.provider, cached: true };
  }

  try {
    let resp;
    if (provider === 'inworld' || provider === 'inworld-hd') {
      const inworldVoice = (_avatarMap[agent] || {}).inworld_voice || 'Ashley';
      const modelId = provider === 'inworld-hd' ? 'inworld-tts-1.5-max' : 'inworld-tts-1.5-mini';
      resp = await fetch('/api/tts/inworld/speak', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ text, voice_id: inworldVoice, model_id: modelId }),
      });
    } else {
      const voiceId = (_avatarMap[agent] || {}).voice_id || '21m00Tcm4TlvDq8ikWAM';
      resp = await fetch('/api/tts/speak', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ text, voice_id: voiceId }),
      });
    }
    if (!resp.ok) {
      if (playingIcon) playingIcon.remove();
      document.getElementById('btn-tts-stop').style.display = 'none';
      try {
        const err = await resp.json();
        _showVoiceToast(err.error || 'Voice synthesis failed');
        if (err.redirect) setTimeout(() => window.location = err.redirect, 2000);
      } catch(_) { _showVoiceToast('Voice synthesis failed'); }
      return null;
    }
    const charCount = parseInt(resp.headers.get('X-TTS-Characters') || text.length);
    const isPremium = resp.headers.get('X-TTS-Premium') === '1';
    const ttsCost = _estimateTtsCost(charCount, provider, isPremium);
    const blob = await resp.blob();
    const url = URL.createObjectURL(blob);
    _ttsCacheSet(text, url, provider, charCount);
    _playAudioBlob(url, playingIcon, false);
    // Add TTS cost to session tracker
    if (ttsCost > 0) {
      _sessionCost += ttsCost;
      _sessionTtsCost += ttsCost;
      updateCostTicker();
    }
    return { characters: charCount, cost: ttsCost, provider, premium: isPremium };
  } catch (e) {
    if (playingIcon) playingIcon.remove();
    document.getElementById('btn-tts-stop').style.display = 'none';
    return null;
  }
}

function _playAudioBlob(url, playingIcon, revokeOnEnd) {
  _ttsAudio = new Audio(url);
  _ttsAudio.volume = _ttsVolume;
  _ttsAudio.onended = () => {
    if (playingIcon) playingIcon.remove();
    if (revokeOnEnd) URL.revokeObjectURL(url);
    _ttsAudio = null;
    document.getElementById('btn-tts-stop').style.display = 'none';
    document.querySelectorAll('.msg-speak-btn.playing').forEach(b => b.classList.remove('playing'));
  };
  _ttsAudio.onerror = _ttsAudio.onended;
  const p = _ttsAudio.play();
  if (p) p.catch(() => { if (playingIcon) playingIcon.remove(); _ttsAudio = null; document.getElementById('btn-tts-stop').style.display = 'none'; });
}

function _updateMetaWithTts(metaEl, apiCostStr, ttsCost, provider, isPremium) {
  if (!metaEl) return;
  const isFree = false;
  const ttsCostStr = ttsCost < 0.001 ? ttsCost.toFixed(6) : ttsCost.toFixed(3);

async function toggleMic() {
  if (!window.isSecureContext) {
    alert('Microphone requires HTTPS or localhost.');
    return;
  }
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    alert('Your browser does not support microphone access.');
    return;
  }
  // Check permission state — if denied, try requesting again to trigger browser prompt
  if (navigator.permissions) {
    try {
      const perm = await navigator.permissions.query({ name: 'microphone' });
      if (perm.state === 'denied') {
        // Attempt getUserMedia to trigger the browser's permission prompt
        try {
          const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
          stream.getTracks().forEach(t => t.stop());
        } catch (_) {
          alert('Microphone access is blocked.\n\nClick the lock icon (\uD83D\uDD12) in your browser address bar \u2192 set Microphone to \"Allow\" \u2192 reload the page.');
          return;
        }
      }
    } catch (_) { /* permissions API not supported for mic, continue normally */ }
  }
  _toggleMicElevenLabs();
}

function _toggleMicElevenLabs() {
  const btn = document.getElementById('btn-mic');
  const ta  = document.getElementById('chat-stimulus');

  // If already recording, stop immediately
  if (_mediaRecorder && _mediaRecorder.state === 'recording') {
    clearInterval(_sttSilenceTimer);
    _sttSilenceTimer = null;
    _mediaRecorder.stop();
    return;
  }

  navigator.mediaDevices.getUserMedia({ audio: true }).then(stream => {
    _sttStream = stream;
    _audioChunks = [];

    // Set up silence detection via AudioContext analyser
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const source = audioCtx.createMediaStreamSource(stream);
    const analyser = audioCtx.createAnalyser();
    analyser.fftSize = 512;
    source.connect(analyser);
    _sttAnalyser = analyser;
    const dataArr = new Uint8Array(analyser.frequencyBinCount);
    let lastSpeechTime = Date.now();
    const SILENCE_MS = 1000;
    const NOISE_THRESHOLD = 15;

    const recorder = new MediaRecorder(stream, { mimeType: 'audio/webm;codecs=opus' });
    _mediaRecorder = recorder;
    recorder.ondataavailable = (e) => { if (e.data.size > 0) _audioChunks.push(e.data); };

    recorder.onstop = async () => {
      // Cleanup audio context and stream
      clearInterval(_sttSilenceTimer); _sttSilenceTimer = null;
      stream.getTracks().forEach(t => t.stop());
      _sttStream = null;
      try { audioCtx.close(); } catch(_) {}
      btn.classList.remove('recording');

      const blob = new Blob(_audioChunks, { type: 'audio/webm' });
      _audioChunks = []; _mediaRecorder = null;
      if (blob.size < 100) return;

      btn.classList.add('transcribing');
      try {
        const formData = new FormData();
        formData.append('file', blob, 'recording.webm');
        formData.append('language', 'en');
        const resp = await fetch('/api/stt/elevenlabs', { method: 'POST', body: formData });
        if (resp.ok) {
          const data = await resp.json();
          const text = (data.text || '').trim();
          console.log('[stt] elevenlabs response:', data);
          // Track STT cost in session
          if (data.stt_cost > 0) {
            _sessionCost += data.stt_cost;
            _sessionSttCost += data.stt_cost;
            updateCostTicker();
          }
          if (text) {
            const startVal = ta.value;
            ta.value = startVal + (startVal && !startVal.endsWith(' ') ? ' ' : '') + text;
            ta.dispatchEvent(new Event('input', { bubbles: true }));
            autoResize(ta); ta.focus();
          } else {
            _showVoiceToast('No speech detected \u2014 try again');
          }
        } else {
          try {
            const err = await resp.json();
            _showVoiceToast(err.error || 'Speech-to-text failed');
            if (err.redirect) setTimeout(() => window.location = err.redirect, 2000);
          } catch(_) { _showVoiceToast('Speech-to-text failed'); }
        }
      } catch (e) { console.error('[stt] elevenlabs error:', e); _showVoiceToast('Speech-to-text error: ' + e.message); }
      btn.classList.remove('transcribing');
    };

    recorder.start();
    btn.classList.add('recording');

    // Monitor silence — auto-stop after 1s of no voice
    _sttSilenceTimer = setInterval(() => {
      if (!_mediaRecorder || _mediaRecorder.state !== 'recording') {
        clearInterval(_sttSilenceTimer); _sttSilenceTimer = null;
        return;
      }
      analyser.getByteFrequencyData(dataArr);
      const avg = dataArr.reduce((a, b) => a + b, 0) / dataArr.length;
      if (avg > NOISE_THRESHOLD) lastSpeechTime = Date.now();
      if (Date.now() - lastSpeechTime > SILENCE_MS) {
        console.log('[stt] auto-stop: silence detected');
        _mediaRecorder.stop();
      }
    }, 200);

  }).catch(err => {
    if (err.name === 'NotAllowedError' || err.name === 'PermissionDeniedError') {
      alert('Microphone access denied.\n\nClick the lock icon (\uD83D\uDD12) in your browser address bar \u2192 set Microphone to \"Allow\" \u2192 reload the page.');
    } else if (err.name === 'NotFoundError') {
      alert('No microphone found. Please connect a microphone and try again.');
    } else {
      alert('Microphone error: ' + err.message);
    }
  });
}

function _estimateCost(model, usage) {
  if (!model || !usage) return null;
  for (const [provider, models] of Object.entries(_pricing)) {
    if (typeof models !== 'object') continue;
    const m = models[model] || models['_default'];
    if (m && m.input_per_1m !== undefined) {
      const inCost = ((usage.prompt_tokens || 0) / 1000000) * m.input_per_1m;
      const outCost = ((usage.completion_tokens || 0) / 1000000) * m.output_per_1m;
      const total = inCost + outCost;
      if (total < 0.001) return total.toFixed(6);
      if (total < 0.01) return total.toFixed(4);
      return total.toFixed(3);
    }
  }
  return null;
}

function chatItemHtml(c) {
  const isActive = c.id === _chatId;
  const emoji = c.emoji || '💬';
  const age = _formatAge(c.created || c.updated);
  return `<div class="sb-chat ${isActive ? 'active' : ''}" draggable="true"
               data-chat-id="${c.id}"
               ondragstart="dragChat(event, '${c.id}')"
               onclick="openChat('${c.id}')">
    <span class="sb-chat-icon">${emoji}</span>
    <span class="sb-chat-title">${esc(c.title || 'New Chat')}</span>
    <span class="sb-chat-age">${age}</span>
    <button class="sb-chat-menu" onclick="event.stopPropagation(); chatMenu(event, '${c.id}', '${escJs(c.title || '')}')">⋯</button>
  </div>`;
}

function _formatAge(isoStr) {
  if (!isoStr) return '';
  const diff = Date.now() - new Date(isoStr).getTime();
  const mins = Math.floor(diff / 60000);
  if (mins < 1) return 'now';
  if (mins < 60) return mins + 'm';
  const hrs = Math.floor(mins / 60);
  if (hrs < 24) return hrs + 'h';
  const days = Math.floor(hrs / 24);
  if (days < 30) return days + 'd';
  return Math.floor(days / 30) + 'mo';
}

function groupByDate(chats) {
  const sorted = [...chats].sort((a, b) => (b.updated || b.created || '').localeCompare(a.updated || a.created || ''));
  const groups = {};
  const now = new Date();
  const today = now.toDateString();
  const yesterday = new Date(now - 86400000).toDateString();
  sorted.forEach(c => {
    const d = new Date(c.updated || c.created);
    let label;
    if (d.toDateString() === today) label = 'Today';
    else if (d.toDateString() === yesterday) label = 'Yesterday';
    else {
      const diff = Math.floor((now - d) / 86400000);
      if (diff < 7) label = 'This Week';
      else if (diff < 30) label = 'This Month';
      else label = 'Older';
    }
    if (!groups[label]) groups[label] = [];
    groups[label].push(c);
  });
  return groups;
}

async function openChat(chatId) {
  const resp = await fetch(`/api/chat/${chatId}`);
  if (!resp.ok) return;
  const chat = await resp.json();
  loadChatIntoThread(chat);
  renderSidebar();

function loadChatIntoThread(chat) {
  _chatId = chat.id;
  _msgs = chat.messages || [];
  const chatEntry = (_index.chats || []).find(c => c.id === chat.id);
  if (chatEntry && chatEntry.folder_id) _openFolders.add(chatEntry.folder_id);
  const agentCap = (chat.agent || 'Agent').charAt(0).toUpperCase() + (chat.agent || '').slice(1);
  document.getElementById('chat-title').textContent = chat.title || agentCap;
  document.getElementById('chat-agent').value = chat.agent || 'astraea';
  _saveChatDefaults();
  // Recalculate session cost
  _sessionCost = 0; _sessionTokens = 0; _sessionCredits = 0; _sessionTtsCost = 0; _sessionSttCost = 0;
  _msgs.forEach(m => {
    if (m.data?.cost?.total_cost) _sessionCost += m.data.cost.total_cost;
    if (m.data?.tts_cost) { _sessionCost += m.data.tts_cost; _sessionTtsCost += m.data.tts_cost; }
    if (m.data?.stt_cost) { _sessionCost += m.data.stt_cost; _sessionSttCost += m.data.stt_cost; }
    if (m.data?.usage) _sessionTokens += (m.data.usage.prompt_tokens||0) + (m.data.usage.completion_tokens||0);
  });
  if (_sessionCost > 0) updateCostTicker();
  else { const t = document.getElementById('cost-ticker'); if (t) t.style.display = 'none'; }
  setMode(chat.mode || 'chat');
  setStatus('idle');
  renderAll();
  renderSidebar();
}

function newChat() {
  _chatId = null;
  _sessionId = null;
  _msgs = [];
  _sessionCost = 0; _sessionTokens = 0; _sessionCredits = 0;
  const ticker = document.getElementById('cost-ticker');
  if (ticker) ticker.style.display = 'none';
  if (_poll) { clearInterval(_poll); _poll = null; }
  document.getElementById('chat-title').textContent = 'Agent Chat';
  setStatus('idle');
  setBusy(false);
  renderAll();
  renderSidebar();
}
