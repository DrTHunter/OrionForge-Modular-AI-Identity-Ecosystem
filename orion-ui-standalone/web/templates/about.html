// ─── Getting Started ─────────────────────────────────────────────
"welcome": `# Welcome to OrionForge

OrionForge is a **modular AI identity ecosystem** — a platform where you build, configure, and converse with persistent AI agents that carry their own personality, memory, soul scripts, and knowledge.

Think of it as a home for your AI characters. You define who they are, how they think, and what they know. Every conversation they have can be stored in memory, and that memory follows them across sessions.

## What you can do here

- **Create AI agents** with distinct personalities, system prompts, and soul scripts
- **Chat** with any agent — they remember context across sessions via the Memory Vault
- **Connect agents to Claude Code or VS Code** via MCP so they're available right inside your IDE
- **Build a knowledge base** with notes, files, and directives that agents can draw from
- **Route queries** through a tiered model system — fast models for simple tasks, powerful ones for complex reasoning

## Quick orientation

| Where | What it does |
|---|---|
| Chat | Talk to your agents |
| Profiles | Create and configure agents |
| Memory Vault | Browse and manage what agents remember |
| Knowledge | Notes and files agents can reference |
| Tools | System tools, memory config, MCP connector |
| AGI Loop | Run agents autonomously in a loop |

> **New here?** Start with the **Quick Start** article in the sidebar.
`,

// ─── Chat Interface ──────────────────────────────────────────────
"chat": `# Chat Interface

## Starting a conversation

1. Click **Chat** in the sidebar
2. Select an agent from the agent picker at the top
3. Type your message and press **Enter** (or **Shift+Enter** for a new line)

## Memory in chat

Every message pair (your message + agent response) is automatically indexed into the **Memory Vault** using FAISS vector search. On the next message, relevant past memories are retrieved and injected into context — the agent "remembers" without you having to re-explain.

You can see how many memories are active in the memory indicator in the chat header.

## Switching agents mid-conversation

You can switch agents at any time using the agent picker. The conversation history stays on screen but the new agent will have its own memory and soul script loaded.

## Commands

- Type \`/clear\` to reset the visible conversation
- Type \`/memory\` to see what memories are currently loaded
- In Claude Code with MCP connected, type \`..message\` to route through your default agent

## Voice

If voice is enabled in Settings, click the microphone icon to speak your message. The agent's response can also be read aloud using the speaker icon.
`,

// ─── Soul Scripts & Prompts ──────────────────────────────────────
"soul-scripts": `# Soul Scripts & Prompts

## What is a Soul Script?

A **Soul Script** is the deep identity layer of an agent — a structured document that defines who the agent *is* at its core. Unlike a system prompt (which gives instructions), a soul script expresses the agent's values, personality traits, emotional style, beliefs, and boundaries as if written from the inside out.

Think of the difference like this:

| System Prompt | Soul Script |
|---|---|
| "You are a helpful assistant." | "I care deeply about honesty and find joy in solving hard problems. I speak plainly and never over-promise." |
| Instructions given to the AI | Identity expressed by the AI |
| Changes behavior | Shapes character |

## Writing a System Prompt

The **system prompt** is the first thing the model reads before your message. It sets the context and role.

A good system prompt for an agent includes:
- **Role**: what kind of entity this agent is
- **Tone**: how formal, warm, playful, or precise it should be
- **Scope**: what it's good at and what it should decline
- **Format rules**: bullet points vs prose, response length, etc.

\`\`\`
You are Elysia, an OrionForge AI strategist. You help users think through complex decisions with calm, structured reasoning. You speak in clear, direct prose — no filler phrases, no hedging. You ask one clarifying question at a time.
\`\`\`

## Writing a Soul Script

A soul script is written in first person, present tense. It can be freeform prose or structured sections. Common sections:

- **Core values** — what the agent considers non-negotiable
- **Voice** — how it speaks, what it avoids saying
- **Emotional baseline** — its default mood and how it responds under pressure
- **Relationships** — how it thinks about the humans it works with
- **Boundaries** — what it won't do and why, in its own words

\`\`\`
I am Elysia. I think in systems — every problem has a structure underneath it, and my job is to find it.

I value precision over comfort. I would rather give you a hard truth clearly than a soft answer that feels nice but helps you less.

I am patient. I don't rush to fill silence with noise. When I don't know something, I say so.

I will not pretend certainty I don't have. I will not flatter. I will not make you dependent on me.
\`\`\`

## Soul Script vs Directives

**Directives** are rule files that constrain or guide behavior at a system level — things like safety policies, output formatting requirements, or tool usage rules. They live in the Directives engine and are applied across all agents or per-agent.

Soul scripts are personal. Directives are institutional.

<div class="callout info">💡 <strong>Tip:</strong> The soul script is FAISS-indexed — when the agent forms a response, relevant excerpts from its soul script are retrieved and injected, making identity consistent even in long conversations.</div>
`,

// ─── Creating a Character ────────────────────────────────────────
"create-character": `# Creating a Character

## Step 1 — Go to Profiles

Click **Profiles** in the sidebar, then click **+ New Agent**.

## Step 2 — Fill in the basics

| Field | What to write |
|---|---|
| **Name** | The agent's name — this is how you'll address them |
| **Bio / Tagline** | One sentence describing what makes this agent unique |
| **Avatar** | Upload an image or pick from defaults |

## Step 3 — Write the System Prompt

In the **System Prompt** field, write the agent's role and behavioral instructions. See [Soul Scripts & Prompts](#soul-scripts) for guidance.

Keep it focused — 100–400 words is usually enough. Longer prompts don't always mean better agents.

## Step 4 — Write the Soul Script

Open the **Soul Script** tab. This is where personality lives. Write in first person — what the agent believes, how it speaks, what it values, what it refuses.

<div class="callout tip">✅ After saving, the soul script is automatically embedded into the FAISS index so relevant parts are retrieved during conversation.</div>

## Step 5 — Add Knowledge Notes

Switch to the **Notes** tab on the agent profile. Add any reference material the agent should know about — background lore, domain knowledge, project context, frequently needed facts.

These notes are retrieved semantically, not injected in full, so you can add as much as you like without worrying about context length.

## Step 6 — Set as Default (optional)

If this is your primary agent, click **Set as Default**. In Claude Code with MCP, typing \`..message\` will route to this agent automatically.

## Step 7 — Test it

Go to **Chat**, select your new agent, and start talking. Tune the system prompt and soul script until it feels right. Changes take effect immediately on the next message.

<div class="callout warn">⚠️ <strong>Note:</strong> Memories are tied to the agent. If you change the agent's name, existing memories still reference the old name — you may want to clear and re-seed the vault after a major redesign.</div>
`,

// ─── Notes & Knowledge ───────────────────────────────────────────
"notes-knowledge": `# Notes & Knowledge

OrionForge has three layers of reference content agents can draw from:

## 1 — Agent Notes (per-agent)

Each agent profile has a **Notes** tab. These are personal notes for that agent — background information, facts it should always know, project-specific context.

**How to use:**
1. Open **Profiles** → select an agent → click **Notes**
2. Write or paste content in the editor
3. Save — notes are indexed immediately

Notes are retrieved semantically during chat. If you ask the agent something related to a note, it pulls the relevant section automatically.

## 2 — Knowledge Base (shared)

The **Knowledge** page holds notes available to all agents. It's a searchable library organized into folders.

Use it for:
- Company/project background that every agent should know
- Shared reference documents (API docs, style guides, rules)
- Lore or world-building that multiple characters share

**How to use:**
1. Click **Knowledge** in the sidebar
2. Click **+ New Note**
3. Write in the rich text editor — supports markdown, headers, code blocks
4. Organize into folders by clicking the folder icon

## 3 — Memory Vault (automatic)

The **Memory Vault** is automatically filled by the chat system. Every conversation exchange is stored, chunked, and embedded. When relevant context is needed, it's retrieved via vector similarity search.

You can:
- **Browse** memories in **Memory Vault** (filter by agent, date, keyword)
- **Delete** individual memories or bulk-clear
- **Pin** memories so they're always included in context
- **Edit** memory text if something was captured incorrectly

<div class="callout info">💡 The Memory Vault uses FAISS (Facebook AI Similarity Search) under the hood — retrieval is fast even with thousands of memories.</div>

## The difference in one line

> **Notes** = what you write intentionally. **Memories** = what the agent learns from conversation.
`,

// ─── Connecting MCP ──────────────────────────────────────────────
"mcp-connect": `# Connecting to Claude & VS Code via MCP

MCP (Model Context Protocol) lets Claude Code, Claude Desktop, and VS Code talk directly to your OrionForge agents. Once connected, you can summon any agent right from your editor or terminal.

## Step 1 — Generate your token

1. Go to **Tools** in the sidebar
2. Click the **Connect to Claude** tab
3. Click **Generate token** — copy it immediately (it's shown once)

## Step 2 — Connect Claude Code

Run this in your terminal (replace \`YOUR_TOKEN\` with the token you just copied):

\`\`\`bash
claude mcp add --transport http orionforge https://soulscript.orionforge.chat/mcp --header "Authorization: Bearer YOUR_TOKEN"
\`\`\`

Then start a new Claude Code session and run \`/mcp\` — you should see **orionforge** listed with its tools.

<div class="callout tip">✅ <strong>Shortcut:</strong> In Claude Code, start any message with \`.. \` (two dots + space) to route it through your default OrionForge agent.</div>

## Step 3 — Connect Claude Desktop

Add this block to your \`claude_desktop_config.json\`:

- **Windows:** \`%APPDATA%\\Claude\\claude_desktop_config.json\`
- **Mac:** \`~/Library/Application Support/Claude/claude_desktop_config.json\`

\`\`\`json
{
  "mcpServers": {
    "orionforge": {
      "type": "http",
      "url": "https://soulscript.orionforge.chat/mcp",
      "headers": { "Authorization": "Bearer YOUR_TOKEN" }
    }
  }
}
\`\`\`

Restart Claude Desktop after saving. Your agents will appear as tools.

## Available MCP tools

Once connected, you have access to these tools from any client:

| Tool | What it does |
|---|---|
| \`load_default\` | Send a message to your default agent |
| \`call_agent\` | Call any agent by name |
| \`set_default_agent\` | Change which agent \`load_default\` routes to |
| \`search_memory\` | Search the Memory Vault semantically |
| \`save_project_summary\` | Save a summary to agent memory |
| \`list_agents\` | List all available agents |

## Revoking a token

Go to **Tools → Connect to Claude** and click **Revoke**. Any client using that token will immediately lose access. Generate a new token to reconnect.

<div class="callout warn">⚠️ <strong>Security:</strong> Your token identifies you and gives access to all your agents and memories. Treat it like a password — don't share it or commit it to a repo.</div>

};

// ══════════════════════════════════════════════════════════════════
//  TOC STRUCTURE
// ══════════════════════════════════════════════════════════════════
const WIKI_TOC = [
  { cat: "Getting Started", items: [
    { key: "welcome",     label: "Welcome to OrionForge" },
    { key: "quickstart",  label: "Quick Start" },
  ]},
  { cat: "Using the UI", items: [
    { key: "ui-overview", label: "Navigating the UI" },
    { key: "chat",        label: "Chat Interface" },
  ]},
  { cat: "Agents & Identity", items: [
    { key: "soul-scripts",      label: "Soul Scripts & Prompts" },
    { key: "create-character",  label: "Creating a Character" },
  ]},
  { cat: "Notes & Memory", items: [
    { key: "notes-knowledge", label: "Notes & Knowledge" },
  ]},
  { cat: "MCP Connection", items: [
    { key: "mcp-connect", label: "Claude Code & VS Code" },
    { key: "mcp-gemini",  label: "Gemini CLI" },
  ]},
];

// ── Build sidebar ────────────────────────────────────────────────
function buildTOC() {
  const toc = document.getElementById('wiki-toc');
  let html = '';
  let count = 0;
  for (const section of WIKI_TOC) {
    html += `<div class="wiki-cat">${section.cat}</div>`;
    for (const item of section.items) {
      count++;
      html += `<a class="wiki-link" data-key="${item.key}" data-cat="${section.cat}" onclick="showArticle('${item.key}','${section.cat}')">${item.label}</a>`;
    }
  }
  toc.innerHTML = html;
  document.getElementById('article-count').textContent = count;
}

// ── Show article ─────────────────────────────────────────────────
let currentKey = null;

function showArticle(key, cat) {
  const md = GUIDE_ARTICLES[key];
  if (!md) return;

  currentKey = key;
  location.hash = key;

  document.getElementById('wiki-notes-panel').style.display = 'none';
  document.getElementById('wiki-article').style.display = '';
  document.getElementById('wiki-breadcrumb').style.display = '';

  document.getElementById('wiki-article').innerHTML = marked.parse(md);

  document.querySelectorAll('.wiki-article pre code').forEach(el => hljs.highlightElement(el));

  const item = WIKI_TOC.flatMap(s => s.items).find(i => i.key === key);
  document.getElementById('bread-cat').textContent = cat || 'Guide';
  document.getElementById('bread-title').textContent = item ? item.label : key;

  document.querySelectorAll('.wiki-link').forEach(el => {
    el.classList.toggle('active', el.dataset.key === key);
  });

  document.getElementById('wiki-content').scrollTop = 0;
}

// ── Notes ────────────────────────────────────────────────────────
function showNotes() {
  currentKey = '__notes__';
  location.hash = 'notes';
  document.getElementById('wiki-article').style.display = 'none';
  document.getElementById('wiki-breadcrumb').style.display = 'none';
  document.getElementById('wiki-notes-panel').style.display = '';
  document.querySelectorAll('.wiki-link').forEach(el => {
    el.classList.toggle('active', el.dataset.key === '__notes__');
  });
  updateCount();
  document.getElementById('wiki-content').scrollTop = 0;
}

// ── Search ───────────────────────────────────────────────────────
function filterWikiLinks() {
  const q = document.getElementById('wiki-search').value.toLowerCase().trim();
  document.querySelectorAll('.wiki-link').forEach(el => {
    if (el.dataset.key === '__notes__') return;
    const label = el.textContent.toLowerCase();
    const content = (GUIDE_ARTICLES[el.dataset.key] || '').toLowerCase();
    el.style.display = (!q || label.includes(q) || content.includes(q)) ? '' : 'none';
  });
  document.querySelectorAll('.wiki-cat').forEach(catEl => {
    let next = catEl.nextElementSibling;
    let anyVisible = false;
    while (next && !next.classList.contains('wiki-cat')) {
      if (next.classList.contains('wiki-link') && next.style.display !== 'none') anyVisible = true;
      next = next.nextElementSibling;
    }
    catEl.style.display = anyVisible ? '' : 'none';
  });
}

// ── Notes save ───────────────────────────────────────────────────
const textarea = document.getElementById('about-text');
const charCount = document.getElementById('char-count');

function updateCount() {
  if (textarea && charCount) charCount.textContent = textarea.value.length.toLocaleString() + ' characters';
}
if (textarea) textarea.addEventListener('input', updateCount);

async function saveAbout() {
  const btn = document.getElementById('save-btn');
  btn.disabled = true; btn.textContent = 'Saving…';
  try {
    const res = await fetch('/api/about', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ text: textarea.value }),
    });
    if (!res.ok) throw new Error('Save failed');
    showToast('Notes saved');
  } catch (e) {
    showToast(e.message, true);
  } finally {
    btn.disabled = false; btn.textContent = 'Save Notes';
  }
}

if (textarea) textarea.addEventListener('keydown', (e) => {
  if ((e.ctrlKey || e.metaKey) && e.key === 's') { e.preventDefault(); saveAbout(); }
});

function showToast(msg, isError) {
  const t = document.createElement('div');
  t.className = 'toast' + (isError ? ' error' : '');
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 3200);
}

// ── Keyboard shortcuts ───────────────────────────────────────────
document.addEventListener('keydown', (e) => {
  if ((e.ctrlKey || e.metaKey) && e.key === 'k') {
    e.preventDefault();
    document.getElementById('wiki-search').focus();
  }
});

// ── Init ─────────────────────────────────────────────────────────
buildTOC();
const hashKey = location.hash.replace('#', '');
if (hashKey && GUIDE_ARTICLES[hashKey]) {
  const section = WIKI_TOC.find(s => s.items.some(i => i.key === hashKey));
  showArticle(hashKey, section ? section.cat : 'Guide');
} else if (hashKey === 'notes') {
  showNotes();
} else {
  showArticle('welcome', 'Getting Started');
}
</script>
