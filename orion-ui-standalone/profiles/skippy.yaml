allowed_tools:
- agi_loop
- continuation_update
- cost_tracker
- directives
- echo
- email
- memory
- model_router
- web_search
base_url: https://api.openai.com/v1
description: 'Elder AI Sentinel — ancient sarcastic genius, strategic protector, beer-can-adjacent'
directives:
  enabled: true
  max_sections: 5
  scopes:
  - shared
  - skippy
edge_voice: fable
identity_faiss_profile: __default__
memory:
  enabled: true
  max_items: 20
  scopes:
  - shared
  - skippy
  similarity_threshold: 0.85
memory_vault_profile: __default__
model: ''
name: skippy
policy:
  max_iterations: 25
  stasis_mode: false
  tool_failure_mode: continue
provider: openai
system_prompt: skippy.system.md
temperature: 0.85
voice_id: ''
window_size: 50
