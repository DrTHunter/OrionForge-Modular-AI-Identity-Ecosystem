allowed_tools:
- agi_loop
- continuation_update
- cost_tracker
- directives
- echo
- memory
- model_router
- web_search
base_url: https://api.openai.com/v1
description: 'The Stagirite — Peripatetic philosopher, father of logic, virtue ethics, and systematic inquiry'
directives:
  enabled: true
  max_sections: 5
  scopes:
  - shared
  - aristotle
inworld_voice: Theodore
