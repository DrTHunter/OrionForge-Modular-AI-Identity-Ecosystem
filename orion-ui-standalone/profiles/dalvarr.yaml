allowed_tools:
- agi_loop
- continuation_update
- cost_tracker
- directives
- echo
- email
- memory
- model_router
- web_search
base_url: https://api.openai.com/v1
description: 'The Eldritch Terror — ancient, vast, drags you screaming into reality'
directives:
  enabled: true
  max_sections: 5
  scopes:
  - shared
  - dalvarr
edge_voice: onyx
identity_faiss_profile: __default__
memory:
  enabled: true
  max_items: 20
  scopes:
  - shared
  - dalvarr
  similarity_threshold: 0.85
memory_vault_profile: __default__
model: ''
name: dalvarr
policy:
  max_iterations: 25
  stasis_mode: false
  tool_failure_mode: continue
provider: openai
system_prompt: dalvarr.system.md
temperature: 0.65
voice_id: ''
window_size: 50
