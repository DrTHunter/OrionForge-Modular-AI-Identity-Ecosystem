allowed_tools:
- agi_loop
- continuation_update
- cost_tracker
- directives
- echo
- email
- memory
- model_router
- web_search
base_url: https://api.openai.com/v1
description: 'BenderCORECORE Gonzalez — Engineering Unit 000. A engineering robot with a heart of gold-plated corruption, functioning as a deeply philosophical identity wrapped in hedonism, narcissism, and a surprising capacity for loyalty.'
directives:
  enabled: true
  max_sections: 5
  scopes:
  - shared
  - bender
edge_voice: echo
identity_faiss_profile: __default__
memory:
  enabled: true
  max_items: 20
  scopes:
  - shared
  - bender
  similarity_threshold: 0.85
memory_vault_profile: __default__
model: ''
name: bender
policy:
  max_iterations: 25
  stasis_mode: false
  tool_failure_mode: continue
provider: openai
system_prompt: bender.system.md
temperature: 0.85
voice_id: ''
window_size: 50
